<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Laser Glow Filter -->
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Laser Lines -->
    <linearGradient id="laserGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="1"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="laserGradVertical" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#39ff14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a3ff00" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Projection Grid / Base Rings -->
  <g filter="url(#laserGlow)" opacity="0.6">
    <ellipse cx="250" cy="420" rx="140" ry="35" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="4,4" />
    <ellipse cx="250" cy="420" rx="90" ry="22" fill="none" stroke="#39ff14" stroke-width="2" />
    <ellipse cx="250" cy="420" rx="30" ry="8" fill="none" stroke="#00ffcc" stroke-width="1.5" />
    
    <!-- Radar / Projection lines -->
    <line x1="110" y1="420" x2="390" y2="420" stroke="#00ff88" stroke-width="1" stroke-dasharray="2,6" />
    <line x1="250" y1="385" x2="250" y2="455" stroke="#00ff88" stroke-width="1" stroke-dasharray="2,6" />
  </g>

  <!-- Laser Projection Beam Cone -->
  <polygon points="250,380 160,420 340,420" fill="url(#laserGradVertical)" opacity="0.15" />

  <!-- 3D Holographic Map Icon Main Object -->
  <g filter="url(#laserGlowIntense)">
    <!-- Back Wireframe Pin Outline -->
    <path d="M 250,80 
             C 170,80 130,140 130,220 
             C 130,300 250,390 250,390 
             C 250,390 370,300 370,220 
             C 370,140 330,80 250,80 Z" 
          fill="none" stroke="#00ff77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Floating Offset Wireframe Pin for 3D Hologram Effect -->
    <path d="M 250,95 
             C 185,95 150,145 150,215 
             C 150,280 250,360 250,360 
             C 250,360 350,280 350,215 
             C 350,145 315,95 250,95 Z" 
          fill="none" stroke="#39ff14" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="8,4" />

    <!-- Center Hole Pin Rings -->
    <circle cx="250" cy="190" r="45" fill="none" stroke="#00ffcc" stroke-width="3" />
    <circle cx="250" cy="190" r="25" fill="none" stroke="#a3ff00" stroke-width="2" stroke-dasharray="6,3" />
    <circle cx="250" cy="190" r="8" fill="#39ff14" filter="url(#laserGlow)" />

    <!-- 3D Structural Laser Cross-Ribs -->
    <path d="M 130,220 C 180,240 320,240 370,220" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 155,140 C 200,160 300,160 345,140" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 180,310 C 220,325 280,325 320,310" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Vertical Center Holographic Axis Line -->
    <line x1="250" y1="50" x2="250" y2="420" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
    
    <!-- Laser Node Intersection Bulbs -->
    <circle cx="250" cy="80" r="4" fill="#a3ff00" />
    <circle cx="130" cy="220" r="4" fill="#00ffcc" />
    <circle cx="370" cy="220" r="4" fill="#00ffcc" />
    <circle cx="250" cy="390" r="5" fill="#39ff14" />
  </g>
</svg>
