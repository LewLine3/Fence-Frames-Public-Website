<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sun Gold Gradient -->
    <linearGradient id="goldGrad1f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE18B" />
      <stop offset="50%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#C29424" />
    </linearGradient>

    <!-- Forest Bright Green Gradient -->
    <linearGradient id="greenGrad1f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="60%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Pressure Treated Wood Tone Gradient -->
    <linearGradient id="ptWoodGrad1f" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#845A42" />
      <stop offset="30%" stop-color="#6C4834" />
      <stop offset="70%" stop-color="#553624" />
      <stop offset="100%" stop-color="#422718" />
    </linearGradient>

    <linearGradient id="ptRailGrad1f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7D5540" />
      <stop offset="40%" stop-color="#6C4834" />
      <stop offset="100%" stop-color="#4A2D1C" />
    </linearGradient>

    <!-- Pressure-Treated Incised Dash Pattern for Vertical Posts -->
    <pattern id="pt-incised-post-1f" width="22" height="34" patternUnits="userSpaceOnUse">
      <rect x="3" y="2" width="2.2" height="11" rx="1" fill="#201009" opacity="0.85" />
      <rect x="14" y="6" width="2.2" height="11" rx="1" fill="#160B06" opacity="0.9" />
      <rect x="8" y="19" width="2.2" height="11" rx="1" fill="#201009" opacity="0.85" />
      <rect x="2" y="22" width="2.2" height="9" rx="1" fill="#160B06" opacity="0.8" />
      <line x1="5.2" y1="2" x2="5.2" y2="13" stroke="#8A6548" stroke-width="0.75" opacity="0.5" />
      <line x1="16.2" y1="6" x2="16.2" y2="17" stroke="#8A6548" stroke-width="0.75" opacity="0.5" />
    </pattern>

    <!-- Pressure-Treated Incised Dash Pattern for Horizontal Rails -->
    <pattern id="pt-incised-rail-1f" width="34" height="22" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="11" height="2.2" rx="1" fill="#201009" opacity="0.85" />
      <rect x="6" y="14" width="11" height="2.2" rx="1" fill="#160B06" opacity="0.9" />
      <rect x="19" y="8" width="11" height="2.2" rx="1" fill="#201009" opacity="0.85" />
      <rect x="22" y="2" width="9" height="2.2" rx="1" fill="#160B06" opacity="0.8" />
      <line x1="2" y1="5.2" x2="13" y2="5.2" stroke="#8A6548" stroke-width="0.75" opacity="0.5" />
      <line x1="19" y1="10.2" x2="30" y2="10.2" stroke="#8A6548" stroke-width="0.75" opacity="0.5" />
    </pattern>

    <!-- Soft Depth Shadow for transparent rendering over any light/dark surface -->
    <filter id="floatShadow1f" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- TRANSPARENT CANVAS (NO BACKGROUND RECT) -->
  <!-- ======================================================== -->

  <!-- OUTSIDE CORNER FRAMING BRACKETS (50% WALL SPAN) -->
  <!-- Top-Right: Sun Gold (#E5B842) -->
  <path d="M 256 12 L 420 12 A 80 80 0 0 1 500 92 L 500 256 L 512 284 L 512 92 A 92 92 0 0 0 420 0 L 284 0 Z" 
        fill="url(#goldGrad1f)" 
        stroke="#0B0E0C" 
        stroke-width="2.5" 
        stroke-linejoin="round" 
        filter="url(#floatShadow1f)" />

  <!-- Bottom-Left: Bright Green (#4ADE80) -->
  <path d="M 256 500 L 92 500 A 80 80 0 0 1 12 420 L 12 256 L 0 284 L 0 420 A 92 92 0 0 0 92 512 L 284 512 Z" 
        fill="url(#greenGrad1f)" 
        stroke="#0B0E0C" 
        stroke-width="2.5" 
        stroke-linejoin="round" 
        filter="url(#floatShadow1f)" />

  <!-- ======================================================== -->
  <!-- ARCHITECTURAL DOUBLE-F POST & RAIL STRUCTURE -->
  <!-- ======================================================== -->
  <g filter="url(#floatShadow1f)">
    
    <!-- POST 1: LEFT VERTICAL PT 4x4 POST (Primary 'F' Backbone) -->
    <!-- Gold Post Cap -->
    <path d="M 96 112 L 130 84 L 164 112 Z" fill="url(#goldGrad1f)" stroke="#0B0E0C" stroke-width="2.5" />
    <rect x="92" y="112" width="76" height="10" rx="2" fill="#E5B842" stroke="#0B0E0C" stroke-width="2.5" />

    <!-- Post Body -->
    <rect x="98" y="122" width="64" height="294" rx="4" fill="url(#ptWoodGrad1f)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="100" y="124" width="60" height="290" fill="url(#pt-incised-post-1f)" />
    <!-- Flow Grain Lines -->
    <path d="M 112 122 Q 110 200 114 280 T 112 416" fill="none" stroke="#3D2418" stroke-width="1.5" opacity="0.6" />
    <path d="M 134 122 Q 138 220 132 320 T 136 416" fill="none" stroke="#FAF6EE" stroke-width="1" opacity="0.25" />
    <rect x="148" y="124" width="12" height="290" fill="#000000" opacity="0.22" />

    <!-- TOP RAIL: PT 2x4 (Forms Top Bar of 1st 'F') -->
    <rect x="162" y="136" width="244" height="58" rx="6" fill="url(#ptRailGrad1f)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="164" y="138" width="240" height="54" fill="url(#pt-incised-rail-1f)" />
    <!-- Gold End Trim Bracket -->
    <path d="M 390 136 L 406 136 C 412 136 416 140 416 146 L 416 184 C 416 190 412 194 406 194 L 390 194 Z" fill="url(#goldGrad1f)" stroke="#0B0E0C" stroke-width="2.5" />
    <line x1="164" y1="152" x2="388" y2="152" stroke="#FAF6EE" stroke-width="1" stroke-opacity="0.35" />
    <line x1="164" y1="174" x2="388" y2="174" stroke="#22120B" stroke-width="1.5" stroke-opacity="0.6" />


    <!-- POST 2: SECONDARY PT 4x4 POST (Spine of 2nd 'F') -->
    <path d="M 238 200 L 270 174 L 302 200 Z" fill="url(#goldGrad1f)" stroke="#0B0E0C" stroke-width="2.5" />
    <rect x="234" y="200" width="72" height="8" rx="2" fill="#E5B842" stroke="#0B0E0C" stroke-width="2.5" />

    <rect x="238" y="208" width="64" height="208" rx="4" fill="url(#ptWoodGrad1f)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="240" y="210" width="60" height="204" fill="url(#pt-incised-post-1f)" />
    <path d="M 254 208 Q 252 280 256 360 T 254 416" fill="none" stroke="#3D2418" stroke-width="1.5" opacity="0.6" />
    <path d="M 276 208 Q 280 300 274 380 T 276 416" fill="none" stroke="#FAF6EE" stroke-width="1" opacity="0.25" />
    <rect x="288" y="210" width="12" height="204" fill="#000000" opacity="0.22" />


    <!-- MID RAIL: PT 2x4 (Forms Mid Bar of 1st 'F' & Top Bar of 2nd 'F') -->
    <rect x="162" y="248" width="224" height="56" rx="6" fill="url(#ptRailGrad1f)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="164" y="250" width="220" height="52" fill="url(#pt-incised-rail-1f)" />
    <!-- Bright Green Accent Stripe -->
    <rect x="162" y="248" width="224" height="8" fill="#4ADE80" opacity="0.9" />
    <!-- Gold Bracket -->
    <path d="M 372 248 L 386 248 C 392 248 396 252 396 258 L 396 294 C 396 300 392 304 386 304 L 372 304 Z" fill="url(#goldGrad1f)" stroke="#0B0E0C" stroke-width="2.5" />


    <!-- LOWER MID RAIL: PT 2x4 (Forms Lower Bar of 2nd 'F') -->
    <rect x="302" y="344" width="76" height="48" rx="5" fill="url(#ptRailGrad1f)" stroke="#0B0E0C" stroke-width="3" />
    <rect x="304" y="346" width="72" height="44" fill="url(#pt-incised-rail-1f)" />
    <rect x="366" y="344" width="12" height="48" rx="2" fill="url(#goldGrad1f)" stroke="#0B0E0C" stroke-width="1.5" />


    <!-- DIRT / EARTH GROUND BASEPLATE -->
    <rect x="76" y="416" width="360" height="18" rx="4" fill="#6A481B" stroke="#0B0E0C" stroke-width="2.5" />
    <rect x="76" y="426" width="360" height="8" rx="2" fill="#3D2418" opacity="0.8" />


    <!-- PRECISION FASTENER BOLTS -->
    <circle cx="130" cy="165" r="7" fill="#0B0E0C" /><circle cx="130" cy="165" r="4" fill="#E5B842" />
    <circle cx="130" cy="276" r="7" fill="#0B0E0C" /><circle cx="130" cy="276" r="4" fill="#4ADE80" />
    <circle cx="270" cy="276" r="7" fill="#0B0E0C" /><circle cx="270" cy="276" r="4" fill="#4ADE80" />
    <circle cx="270" cy="368" r="7" fill="#0B0E0C" /><circle cx="270" cy="368" r="4" fill="#E5B842" />
  </g>

  <!-- ======================================================== -->
  <!-- PACIFIC NORTHWEST NATURAL GRASS BLADES -->
  <!-- ======================================================== -->
  <g id="Front-Grass-Layer-1f" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))">
    
    <!-- Left Grass Patch -->
    <g transform="translate(68, 396)">
      <path d="M 12 28 C 10 16 4 6 0 0 C 8 8 16 18 16 28 Z" fill="#113016" />
      <path d="M 18 28 C 20 14 26 4 32 0 C 28 8 24 18 22 28 Z" fill="#227E1F" />
      <path d="M 28 28 C 30 10 38 2 48 0 C 40 8 36 18 32 28 Z" fill="#4ADE80" />
      <path d="M 38 28 C 36 16 32 8 26 2 C 34 8 40 18 42 28 Z" fill="#318116" />
      <path d="M 46 28 C 50 12 56 2 64 0 C 58 10 52 20 50 28 Z" fill="#227E1F" />
      <path d="M 54 28 C 56 16 62 8 70 4 C 64 12 60 20 58 28 Z" fill="#4ADE80" />
      <path d="M 66 28 C 68 18 76 10 84 6 C 78 14 74 22 70 28 Z" fill="#113016" />
    </g>

    <!-- Center Grass Patch -->
    <g transform="translate(196, 396)">
      <path d="M 10 28 C 8 16 2 8 0 2 C 8 8 14 18 14 28 Z" fill="#227E1F" />
      <path d="M 18 28 C 22 12 28 2 36 0 C 30 8 26 18 22 28 Z" fill="#4ADE80" />
      <path d="M 30 28 C 32 16 38 8 46 4 C 40 12 36 20 34 28 Z" fill="#113016" />
      <path d="M 44 28 C 42 12 38 4 32 0 C 40 6 46 16 48 28 Z" fill="#318116" />
      <path d="M 54 28 C 58 10 66 2 76 0 C 68 8 62 18 58 28 Z" fill="#4ADE80" />
      <path d="M 68 28 C 70 16 78 8 86 4 C 80 12 76 20 72 28 Z" fill="#227E1F" />
      <path d="M 80 28 C 82 18 90 10 98 6 C 92 14 88 22 84 28 Z" fill="#113016" />
    </g>

    <!-- Right Grass Patch -->
    <g transform="translate(328, 396)">
      <path d="M 12 28 C 10 16 4 6 0 0 C 8 8 16 18 16 28 Z" fill="#113016" />
      <path d="M 22 28 C 26 12 34 2 44 0 C 36 8 30 18 26 28 Z" fill="#4ADE80" />
      <path d="M 36 28 C 38 16 46 8 54 4 C 48 12 44 20 40 28 Z" fill="#227E1F" />
      <path d="M 50 28 C 54 14 62 6 72 2 C 64 10 58 18 54 28 Z" fill="#318116" />
      <path d="M 64 28 C 66 18 74 10 82 6 C 76 14 72 22 68 28 Z" fill="#4ADE80" />
      <path d="M 76 28 C 78 20 86 12 94 8 C 88 16 84 22 80 28 Z" fill="#113016" />
    </g>
  </g>
</svg>
