<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Bright Emerald Green (Big 'F' - 1AD Standard) -->
    <linearGradient id="brightEmeraldGrad1ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#2EA055" />
      <stop offset="100%" stop-color="#1E7A3E" />
    </linearGradient>

    <linearGradient id="brightEmeraldCapLeft1ai" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EA055" />
      <stop offset="50%" stop-color="#3DC06F" />
      <stop offset="100%" stop-color="#6EE7A0" />
    </linearGradient>

    <linearGradient id="brightEmeraldCapRight1ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA055" />
      <stop offset="50%" stop-color="#1B7A45" />
      <stop offset="100%" stop-color="#12562F" />
    </linearGradient>

    <!-- Muted Sage-Spruce Green (Small 'F' - 1AD Standard) -->
    <linearGradient id="sageSpruceGrad1ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C8564" />
      <stop offset="45%" stop-color="#366A4D" />
      <stop offset="100%" stop-color="#254F38" />
    </linearGradient>

    <linearGradient id="sageSpruceCapLeft1ai" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#366A4D" />
      <stop offset="50%" stop-color="#4A8462" />
      <stop offset="100%" stop-color="#619E7A" />
    </linearGradient>

    <linearGradient id="sageSpruceCapRight1ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#366A4D" />
      <stop offset="50%" stop-color="#28543B" />
      <stop offset="100%" stop-color="#1A3E2A" />
    </linearGradient>

    <!-- Warm Golden-Brown Pressure Treated Tone -->
    <linearGradient id="ptWarmWoodGrad1ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="35%" stop-color="#754E36" />
      <stop offset="75%" stop-color="#633F2A" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <linearGradient id="ptWarmRailGrad1ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="45%" stop-color="#754E36" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <!-- Rich Earth Brown Soil Gradient -->
    <linearGradient id="soilGrad1ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#754E29" />
      <stop offset="40%" stop-color="#5A3818" />
      <stop offset="100%" stop-color="#3D230D" />
    </linearGradient>

    <!-- Precision Incision Grid for Posts -->
    <pattern id="pt-grid-post-1ai" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="17" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="10.5" y="21" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <!-- Precision Incision Grid for Rails -->
    <pattern id="pt-grid-rail-1ai" width="34" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="4" y="17" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="21" y="10.5" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <!-- Soft Depth Shadow -->
    <filter id="shadow1ai" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
