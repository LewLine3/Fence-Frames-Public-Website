      <path d="M 48 48 L 94 28 L 94 48 Z" fill="url(#brightEmeraldCapLeft1ai)" stroke="#0B0E0C" stroke-width="2" stroke-linejoin="round" />
      <path d="M 94 28 L 140 48 L 94 48 Z" fill="url(#brightEmeraldCapRight1ai)" stroke="#0B0E0C" stroke-width="2" stroke-linejoin="round" />
      <circle cx="94" cy="28" r="3" fill="#6EE7A0" stroke="#0B0E0C" stroke-width="1.5" />

