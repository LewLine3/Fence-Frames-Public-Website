  <!-- 100% PURE TRANSPARENT CANVAS -->
  <!-- 1AD CANONICAL MONOGRAM (VIBRANT EMERALD BIG 'F' + SAGE-SPRUCE SMALL 'F') -->
  <!-- THIN BROWN SOIL LINE + DENSE SHORT GRASS WITH NATURAL SOIL GAPS -->
  <!-- ======================================================== -->
  <g filter="url(#shadow1ai)">

    <!-- ======================================================== -->
    <!-- 1ST BIG 'F' (BRIGHT EMERALD GREEN #2EA055) -->
    <!-- ======================================================== -->
    <g id="Big-F-Bright-Emerald">
      
      <!-- Outer Black Keyline Layer -->
      <path d="M 56 54 L 132 54 L 434 54 C 440 54 444 58 444 64 L 444 112 C 444 118 440 122 434 122 L 132 122 L 132 196 L 192 196 L 192 260 L 132 260 L 132 424 L 56 424 Z" 
            fill="none" 
            stroke="#0B0E0C" 
            stroke-width="7.5" 
            stroke-linejoin="round" />

      <!-- Bright Emerald Green Outline & Timber Fill -->
      <path d="M 56 54 L 132 54 L 434 54 C 440 54 444 58 444 64 L 444 112 C 444 118 440 122 434 122 L 132 122 L 132 196 L 192 196 L 192 260 L 132 260 L 132 424 L 56 424 Z" 
            fill="url(#ptWarmWoodGrad1ai)" 
            stroke="#2EA055" 
            stroke-width="4.5" 
            stroke-linejoin="round" />

      <!-- Timber Incision Texture Overlay -->
      <rect x="58" y="56" width="72" height="366" fill="url(#pt-grid-post-1ai)" />
      <rect x="134" y="56" width="298" height="64" fill="url(#pt-grid-rail-1ai)" />
      <rect x="134" y="198" width="56" height="60" fill="url(#pt-grid-rail-1ai)" />

