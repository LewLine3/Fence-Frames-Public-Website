<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Big 'F': Vibrant Emerald Green (#2EA055) -->
    <linearGradient id="emeraldGrad1cz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#2EA055" />
      <stop offset="100%" stop-color="#1B7A45" />
    </linearGradient>

    <linearGradient id="emeraldCapLeft1cz" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EA055" />
      <stop offset="50%" stop-color="#3DC06F" />
      <stop offset="100%" stop-color="#6EE7A0" />
    </linearGradient>

    <linearGradient id="emeraldCapRight1cz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA055" />
      <stop offset="50%" stop-color="#1B7A45" />
      <stop offset="100%" stop-color="#12562F" />
    </linearGradient>

    <!-- Small 'F': Golden-Tan Hybrid (#DEB35E) -->
    <linearGradient id="goldTanGrad1cz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF9E" />
      <stop offset="45%" stop-color="#DEB35E" />
      <stop offset="100%" stop-color="#A87A24" />
    </linearGradient>

    <linearGradient id="goldTanCapLeft1cz" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEB35E" />
      <stop offset="50%" stop-color="#ECC675" />
      <stop offset="100%" stop-color="#FFF0CC" />
    </linearGradient>

    <linearGradient id="goldTanCapRight1cz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEB35E" />
      <stop offset="50%" stop-color="#BD9038" />
      <stop offset="100%" stop-color="#8C6318" />
    </linearGradient>

    <!-- PT Appearance Warm Timber Gradient -->
    <linearGradient id="ptAppearanceWoodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E6348" />
      <stop offset="25%" stop-color="#7B5238" />
      <stop offset="55%" stop-color="#855B3F" />
      <stop offset="80%" stop-color="#6E462C" />
      <stop offset="100%" stop-color="#5A3720" />
    </linearGradient>

    <!-- Soil Foundation -->
    <linearGradient id="soilGrad1cz" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A542E" />
      <stop offset="40%" stop-color="#6A481B" />
      <stop offset="100%" stop-color="#4E3114" />
    </linearGradient>

    <!-- PT Appearance Natural Wood Grain Texture (Vertical Grain for Posts, Horizontal for Rails) -->
    <pattern id="pt-grain-vertical" width="32" height="128" patternUnits="userSpaceOnUse">
      <!-- Fine growth ring fiber lines -->
      <line x1="4" y1="0" x2="4" y2="128" stroke="#462512" stroke-width="0.75" opacity="0.25" />
      <line x1="9" y1="0" x2="9" y2="128" stroke="#A87A54" stroke-width="0.5" opacity="0.3" />
      <line x1="15" y1="0" x2="15" y2="128" stroke="#462512" stroke-width="1.0" opacity="0.2" />
      <line x1="21" y1="0" x2="21" y2="128" stroke="#A87A54" stroke-width="0.6" opacity="0.35" />
      <line x1="27" y1="0" x2="27" y2="128" stroke="#3A1D0B" stroke-width="0.8" opacity="0.2" />
      <!-- Subtle organic grain waves -->
      <path d="M 6 0 Q 8 64 6 128" fill="none" stroke="#2B1508" stroke-width="0.5" opacity="0.2" />
      <path d="M 18 0 Q 16 64 18 128" fill="none" stroke="#A87A54" stroke-width="0.5" opacity="0.25" />
    </pattern>

    <pattern id="pt-grain-horizontal" width="128" height="32" patternUnits="userSpaceOnUse">
      <!-- Fine growth ring fiber lines -->
      <line x1="0" y1="4" x2="128" y2="4" stroke="#462512" stroke-width="0.75" opacity="0.25" />
      <line x1="0" y1="9" x2="128" y2="9" stroke="#A87A54" stroke-width="0.5" opacity="0.3" />
      <line x1="0" y1="15" x2="128" y2="15" stroke="#462512" stroke-width="1.0" opacity="0.2" />
      <line x1="0" y1="21" x2="128" y2="21" stroke="#A87A54" stroke-width="0.6" opacity="0.35" />
      <line x1="0" y1="27" x2="128" y2="27" stroke="#3A1D0B" stroke-width="0.8" opacity="0.2" />
      <!-- Subtle organic grain waves -->
      <path d="M 0 6 Q 64 8 128 6" fill="none" stroke="#2B1508" stroke-width="0.5" opacity="0.2" />
      <path d="M 0 18 Q 64 16 128 18" fill="none" stroke="#A87A54" stroke-width="0.5" opacity="0.25" />
    </pattern>

    <filter id="shadow1cz" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="capShadow1cz" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 100% PURE TRANSPARENT CANVAS -->
  <!-- TRIAL CONCEPT 1CZ: PT APPEARANCE WOOD GRAIN (NO INCISED TEXTURE) -->
  <!-- Natural wood growth rings and timber grain with ZERO incision slits! -->
  <!-- ======================================================== -->
  <g filter="url(#shadow1cz)">

    <!-- ======================================================== -->
    <!-- 1. SOIL FOUNDATION BASEPLATE (x=57..313.05, y=412..428) -->
    <!-- ======================================================== -->
    <g id="Soil-Foundation-Plinth-1cz">
      <path d="M 57 412 L 305 412 C 309 412 313.05 414.5 313.05 420 C 313.05 425.5 309 428 305 428 L 57 428 Z" 
            fill="url(#soilGrad1cz)" />
      <line x1="57" y1="412" x2="305" y2="412" stroke="#0B0E0C" stroke-width="2.0" />
      <line x1="57" y1="428" x2="305" y2="428" stroke="#0B0E0C" stroke-width="2.0" />
      <path d="M 305 412 L 309 412 C 311.5 412 313.05 414.5 313.05 420 C 313.05 425.5 311.5 428 309 428 L 305 428 Z" 
            fill="#0B0E0C" stroke="#0B0E0C" stroke-width="1.2" stroke-linejoin="round" />
      <line x1="305" y1="412" x2="305" y2="428" stroke="#0B0E0C" stroke-width="1.4" />
    </g>


    <!-- ======================================================== -->
    <!-- 2. 1ST BIG 'F' (PT APPEARANCE WOOD GRAIN) -->
    <!-- ======================================================== -->
    <g id="Big-F-Structure-1cz">
      <!-- 1. Outer Black Keyline (14.4px stroke) -->
      <path d="M 64 54 L 430 54 C 436 54 440 58 440 64 L 440 110 C 440 116 436 120 430 120 L 128 120 L 128 182 L 170 182 L 170 242 L 128 242 L 128 412 L 64 412 Z" 
            fill="none" 
            stroke="#0B0E0C" 
            stroke-width="14.4" 
            stroke-linejoin="round" />

      <!-- 2. 4.2px Emerald Green Ribbon (11.4px stroke) DOCKING UNDER CAP TO x=64! -->
      <path d="M 64 54 L 430 54 C 436 54 440 58 440 64 L 440 110 C 440 116 436 120 430 120 L 128 120 L 128 182 L 170 182 L 170 242 L 128 242 L 128 412 L 64 412 Z" 
            fill="none" 
            stroke="#2EA055" 
            stroke-width="11.4" 
            stroke-linejoin="round" />

      <!-- 3. Primary Inner Perimeter Black Line (3.0px stroke) with PT Appearance Wood Fill -->
      <path d="M 64 54 L 430 54 C 436 54 440 58 440 64 L 440 110 C 440 116 436 120 430 120 L 128 120 L 128 182 L 170 182 L 170 242 L 128 242 L 128 412 L 64 412 Z" 
            fill="url(#ptAppearanceWoodGrad)" 
            stroke="#0B0E0C" 
            stroke-width="3.0" 
            stroke-linejoin="round" />

      <!-- PT Appearance Natural Wood Grain Overlays (NO INCISED SLITS!) -->
      <rect x="64" y="54" width="64" height="358" fill="url(#pt-grain-vertical)" />
      <rect x="128" y="54" width="302" height="66" fill="url(#pt-grain-horizontal)" />
      <rect x="128" y="182" width="42" height="60" fill="url(#pt-grain-horizontal)" />

      <!-- Top Rail Hardware Black Bullet Endcap (x=440.00) -->
      <path d="M 430 54 L 434 54 C 438 54 440 58 440 64 L 440 110 C 440 116 438 120 434 120 L 430 120 Z" 
            fill="#0B0E0C" stroke="#0B0E0C" stroke-width="1.2" />

      <!-- FORKED INTERIOR BLACK LINES (3.0px) -->
      <path d="M 128 54 L 430 54 C 436 54 440 58 440 64 L 440 110 C 440 116 436 120 430 120 L 128 120 Z" 
            fill="none" stroke="#0B0E0C" stroke-width="3.0" stroke-linejoin="round" />

      <path d="M 128 182 L 170 182 L 170 242 L 128 242 Z" 
            fill="none" stroke="#0B0E0C" stroke-width="3.0" stroke-linejoin="round" />
    </g>


    <!-- ======================================================== -->
    <!-- 3. 2ND SMALL 'F' (PT APPEARANCE WOOD GRAIN) -->
    <!-- ======================================================== -->
    <g id="Small-F-Structure-1cz">
      <path d="M 170 182 L 384.35 182 C 388.35 182 392.35 186 392.35 192 L 392.35 232 C 392.35 238 388.35 242 384.35 242 L 234 242 L 234 304 L 339 304 C 343 304 347 308 347 313 L 347 349 C 347 354 343 358 339 358 L 234 358 L 234 412 L 170 412 Z" 
            fill="none" stroke="#0B0E0C" stroke-width="14.4" stroke-linejoin="round" />

      <path d="M 170 182 L 384.35 182 C 388.35 182 392.35 186 392.35 192 L 392.35 232 C 392.35 238 388.35 242 384.35 242 L 234 242 L 234 304 L 339 304 C 343 304 347 308 347 313 L 347 349 C 347 354 343 358 339 358 L 234 358 L 234 412 L 170 412 Z" 
            fill="none" stroke="#DEB35E" stroke-width="11.4" stroke-linejoin="round" />

      <path d="M 170 182 L 384.35 182 C 388.35 182 392.35 186 392.35 192 L 392.35 232 C 392.35 238 388.35 242 384.35 242 L 234 242 L 234 304 L 339 304 C 343 304 347 308 347 313 L 347 349 C 347 354 343 358 339 358 L 234 358 L 234 412 L 170 412 Z" 
            fill="url(#ptAppearanceWoodGrad)" stroke="#0B0E0C" stroke-width="3.0" stroke-linejoin="round" />

      <!-- PT Appearance Grain Overlays (NO INCISED SLITS!) -->
      <rect x="170" y="182" width="64" height="230" fill="url(#pt-grain-vertical)" />
      <rect x="234" y="182" width="150.35" height="60" fill="url(#pt-grain-horizontal)" />
      <rect x="234" y="304" width="105" height="54" fill="url(#pt-grain-horizontal)" />

      <!-- Collinear Tip 2 at x=392.35, Tip 3 at x=347.00 -->
      <path d="M 384.35 182 L 388.35 182 C 390.85 182 392.35 185 392.35 190 L 392.35 234 C 392.35 239 390.85 242 388.35 242 L 384.35 242 Z" 
            fill="#0B0E0C" stroke="#0B0E0C" stroke-width="1.2" />

      <path d="M 339 304 L 343 304 C 345.5 304 347 307 347 312 L 347 350 C 347 355 345.5 358 343 358 L 339 358 Z" 
            fill="#0B0E0C" stroke="#0B0E0C" stroke-width="1.2" />

      <!-- FORKED INTERIOR BLACK LINES (3.0px) -->
      <path d="M 234 182 L 384.35 182 C 388.35 182 392.35 186 392.35 192 L 392.35 232 C 392.35 238 388.35 242 384.35 242 L 234 242 Z" 
            fill="none" stroke="#0B0E0C" stroke-width="3.0" stroke-linejoin="round" />

      <path d="M 234 304 L 339 304 C 343 304 347 308 347 313 L 347 349 C 347 354 343 358 339 358 L 234 358 Z" 
            fill="none" stroke="#0B0E0C" stroke-width="3.0" stroke-linejoin="round" />
    </g>


    <!-- ======================================================== -->
    <!-- 4. POST CAPS (RENDERED PROMINENTLY ON TOP LAYER!) -->
    <!-- ======================================================== -->
    <g id="Post-Caps-Top-Layer" filter="url(#capShadow1cz)">
      <!-- Post 1 Emerald Peaked Cap -->
      <g id="Post-1-Cap">
        <rect x="52" y="43" width="88" height="13" rx="3.5" fill="#2EA055" stroke="#0B0E0C" stroke-width="2.8" />
        <path d="M 54 43 L 96 22 L 96 43 Z" fill="url(#emeraldCapLeft1cz)" stroke="#0B0E0C" stroke-width="2.2" stroke-linejoin="round" />
        <path d="M 96 22 L 138 43 L 96 43 Z" fill="url(#emeraldCapRight1cz)" stroke="#0B0E0C" stroke-width="2.2" stroke-linejoin="round" />
      </g>

      <!-- Post 2 Golden-Tan Peaked Cap -->
      <g id="Post-2-Cap">
        <rect x="158" y="171" width="88" height="13" rx="3.5" fill="#DEB35E" stroke="#0B0E0C" stroke-width="2.8" />
        <path d="M 160 171 L 202 150 L 202 171 Z" fill="url(#goldTanCapLeft1cz)" stroke="#0B0E0C" stroke-width="2.2" stroke-linejoin="round" />
        <path d="M 202 150 L 244 171 L 202 171 Z" fill="url(#goldTanCapRight1cz)" stroke="#0B0E0C" stroke-width="2.2" stroke-linejoin="round" />
      </g>
    </g>

  </g>

  <!-- ======================================================== -->
  <!-- 5. REFINED ALL-GREEN FRONT GRASS TUFTS -->
  <!-- ======================================================== -->
  <g id="Front-Grass-Layer-1cz" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))">
    <g transform="translate(64, 390)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 9 9 18 19 18 30 Z" fill="#0C3D20" />
      <path d="M 22 30 C 24 15 31 4 38 0 C 33 9 29 19 26 30 Z" fill="#1B7A45" />
      <path d="M 34 30 C 36 11 46 2 58 0 C 48 9 43 19 38 30 Z" fill="#4ADE80" />
      <path d="M 46 30 C 43 17 38 9 31 2 C 41 9 48 19 50 30 Z" fill="#28874B" />
      <path d="M 56 30 C 60 13 67 2 77 0 C 70 11 62 21 60 30 Z" fill="#1B7A45" />
      <path d="M 66 30 C 68 17 75 9 85 4 C 77 13 72 21 70 30 Z" fill="#4ADE80" />
      <path d="M 80 30 C 82 19 92 11 102 6 C 94 15 90 23 85 30 Z" fill="#0C3D20" />
    </g>

    <g transform="translate(150, 390) scale(1.2, 1)">
      <path d="M 12 30 C 10 17 2 9 0 2 C 10 9 17 19 17 30 Z" fill="#1B7A45" />
      <path d="M 22 30 C 27 13 34 2 44 0 C 36 9 31 19 26 30 Z" fill="#4ADE80" />
      <path d="M 36 30 C 39 17 46 9 56 4 C 48 13 43 21 41 30 Z" fill="#0C3D20" />
      <path d="M 53 30 C 51 13 46 4 39 0 C 48 6 56 17 58 30 Z" fill="#28874B" />
      <path d="M 65 30 C 70 11 80 2 92 0 C 82 9 75 19 70 30 Z" fill="#4ADE80" />
      <path d="M 82 30 C 84 17 94 9 104 4 C 96 13 92 21 87 30 Z" fill="#1B7A45" />
      <path d="M 97 30 C 99 19 109 11 119 6 C 111 15 107 23 102 30 Z" fill="#0C3D20" />
    </g>
  </g>
</svg>
