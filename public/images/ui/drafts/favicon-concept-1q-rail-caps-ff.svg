<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sun Gold Gradient -->
    <linearGradient id="goldGrad1q" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE18B" />
      <stop offset="45%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#C29424" />
    </linearGradient>

    <!-- Warm Golden-Brown Pressure Treated Tone -->
    <linearGradient id="ptWarmWoodGrad1q" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="35%" stop-color="#754E36" />
      <stop offset="75%" stop-color="#633F2A" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <linearGradient id="ptWarmRailGrad1q" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="45%" stop-color="#754E36" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <!-- Rail Cap 2x4 Flat Board Gradient -->
    <linearGradient id="railCapGrad1q" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#946548" />
      <stop offset="50%" stop-color="#7D553C" />
      <stop offset="100%" stop-color="#633F2A" />
    </linearGradient>

    <!-- Precision Incision Grid for Posts -->
    <pattern id="pt-grid-post-1q" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="17" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="10.5" y="21" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <!-- Precision Incision Grid for Rails -->
    <pattern id="pt-grid-rail-1q" width="34" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="4" y="17" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="21" y="10.5" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <!-- Soft Depth Shadow -->
    <filter id="shadow1q" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 100% PURE TRANSPARENT CANVAS -->
  <!-- CONTINUOUS 2x4 RAIL CAPS OVER POSTS (CRAFTSMAN CAP STYLE) -->
  <!-- NO POST CAPS • TOP & MIDDLE RAIL CAPS RUN OVER POSTS -->
  <!-- ======================================================== -->
  <g filter="url(#shadow1q)">
    
    <!-- POST 1: LEFT VERTICAL PT 4x4 POST (Sits Under Top Rail Cap) -->
    <rect x="56" y="62" width="76" height="362" rx="4" fill="url(#ptWarmWoodGrad1q)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="58" y="64" width="72" height="358" fill="url(#pt-grid-post-1q)" />

    <!-- TOP MAIN RAIL (PT 2x4: Sits Under Top Rail Cap) -->
    <rect x="132" y="62" width="308" height="58" rx="5" fill="url(#ptWarmRailGrad1q)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="134" y="64" width="304" height="54" fill="url(#pt-grid-rail-1q)" />
    <rect x="424" y="62" width="16" height="58" fill="url(#goldGrad1q)" stroke="#0B0E0C" stroke-width="2" />


    <!-- ======================================================== -->
    <!-- TOP RAIL CAP (2x4 FLAT ON EDGE: RUNS CONTINUOUS OVER POST 1) -->
    <!-- ======================================================== -->
    <rect x="48" y="40" width="400" height="22" rx="4" fill="url(#railCapGrad1q)" stroke="#0B0E0C" stroke-width="3.5" />
    <!-- Sun Gold End Trim on Top Rail Cap -->
    <path d="M 432 40 L 448 40 C 452 40 456 43 456 47 L 456 55 C 456 59 452 62 448 62 L 432 62 Z" fill="url(#goldGrad1q)" stroke="#0B0E0C" stroke-width="2" />
    <!-- Left Beveled Chamfer on Top Cap -->
    <path d="M 48 44 L 56 40 L 56 62 L 48 58 Z" fill="#4E301E" stroke="#0B0E0C" stroke-width="1.5" />


    <!-- POST 2: SECONDARY PT 4x4 POST (Sits Under Middle Rail Cap at y=206) -->
    <rect x="192" y="206" width="76" height="218" rx="4" fill="url(#ptWarmWoodGrad1q)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="194" y="208" width="72" height="214" fill="url(#pt-grid-post-1q)" />

    <!-- MID RAIL SEGMENT 1 (Between Post 1 & Post 2: Sits Under Middle Cap) -->
    <rect x="132" y="206" width="60" height="52" rx="4" fill="url(#ptWarmRailGrad1q)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="134" y="208" width="56" height="48" fill="url(#pt-grid-rail-1q)" />

    <!-- MID RAIL SEGMENT 2 (Right of Post 2: Sits Under Middle Cap) -->
    <rect x="268" y="206" width="144" height="52" rx="5" fill="url(#ptWarmRailGrad1q)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="270" y="208" width="140" height="48" fill="url(#pt-grid-rail-1q)" />
    <rect x="396" y="206" width="16" height="52" fill="url(#goldGrad1q)" stroke="#0B0E0C" stroke-width="2" />


    <!-- ======================================================== -->
    <!-- MIDDLE RAIL CAP (RUNS CONTINUOUS OVER TOP OF POST 2) -->
    <!-- (Replaces the green stripe, sits directly on top of Post 2 & Mid Rails) -->
    <!-- ======================================================== -->
    <rect x="132" y="184" width="288" height="22" rx="4" fill="url(#railCapGrad1q)" stroke="#0B0E0C" stroke-width="3.5" />
    <!-- Sun Gold End Trim on Middle Rail Cap -->
    <path d="M 404 184 L 420 184 C 424 184 428 187 428 191 L 428 199 C 428 203 424 206 420 206 L 404 206 Z" fill="url(#goldGrad1q)" stroke="#0B0E0C" stroke-width="2" />


    <!-- LOWER MID RAIL: 2ND "F" MID BEAM (Positioned at y=308) -->
    <rect x="268" y="308" width="108" height="52" rx="5" fill="url(#ptWarmRailGrad1q)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="270" y="310" width="104" height="48" fill="url(#pt-grid-rail-1q)" />
    <!-- Gold End Trim -->
    <rect x="360" y="308" width="16" height="52" rx="2" fill="url(#goldGrad1q)" stroke="#0B0E0C" stroke-width="2" />


    <!-- DIRT / EARTH GROUND BASEPLATE -->
    <rect x="36" y="424" width="440" height="20" rx="5" fill="#6A481B" stroke="#0B0E0C" stroke-width="3" />


    <!-- PRECISION JOINERY FASTENER BOLTS -->
    <!-- Post 1 Top Bolt -->
    <circle cx="94" cy="91" r="8" fill="#0B0E0C" /><circle cx="94" cy="91" r="4.5" fill="#E5B842" />
    
    <!-- Post 1 Mid Bolt -->
    <circle cx="94" cy="232" r="8" fill="#0B0E0C" /><circle cx="94" cy="232" r="4.5" fill="#4ADE80" />
    
    <!-- Post 2 Top / In-Feed Bolt (Left) -->
    <circle cx="212" cy="232" r="7" fill="#0B0E0C" /><circle cx="212" cy="232" r="3.8" fill="#4ADE80" />
    
    <!-- Post 2 Top / Out-Feed Bolt (Right) -->
    <circle cx="248" cy="232" r="7" fill="#0B0E0C" /><circle cx="248" cy="232" r="3.8" fill="#4ADE80" />
    
    <!-- Post 2 Lower Mid Bolt -->
    <circle cx="230" cy="334" r="7.5" fill="#0B0E0C" /><circle cx="230" cy="334" r="4" fill="#E5B842" />
  </g>

  <!-- ======================================================== -->
  <!-- PACIFIC NORTHWEST NATURAL GRASS BLADES -->
  <!-- Grounding the structure with natural emerald blades -->
  <!-- ======================================================== -->
  <g id="Front-Grass-Layer-1q" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))">
    <g transform="translate(28, 402)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 9 9 18 19 18 30 Z" fill="#113016" />
      <path d="M 22 30 C 24 15 31 4 38 0 C 33 9 29 19 26 30 Z" fill="#227E1F" />
      <path d="M 34 30 C 36 11 46 2 58 0 C 48 9 43 19 38 30 Z" fill="#4ADE80" />
      <path d="M 46 30 C 43 17 38 9 31 2 C 41 9 48 19 50 30 Z" fill="#318116" />
      <path d="M 56 30 C 60 13 67 2 77 0 C 70 11 62 21 60 30 Z" fill="#227E1F" />
      <path d="M 66 30 C 68 17 75 9 85 4 C 77 13 72 21 70 30 Z" fill="#4ADE80" />
      <path d="M 80 30 C 82 19 92 11 102 6 C 94 15 90 23 85 30 Z" fill="#113016" />
    </g>
    <g transform="translate(164, 402)">
      <path d="M 12 30 C 10 17 2 9 0 2 C 10 9 17 19 17 30 Z" fill="#227E1F" />
      <path d="M 22 30 C 27 13 34 2 44 0 C 36 9 31 19 26 30 Z" fill="#4ADE80" />
      <path d="M 36 30 C 39 17 46 9 56 4 C 48 13 43 21 41 30 Z" fill="#113016" />
      <path d="M 53 30 C 51 13 46 4 39 0 C 48 6 56 17 58 30 Z" fill="#318116" />
      <path d="M 65 30 C 70 11 80 2 92 0 C 82 9 75 19 70 30 Z" fill="#4ADE80" />
      <path d="M 82 30 C 84 17 94 9 104 4 C 96 13 92 21 87 30 Z" fill="#227E1F" />
      <path d="M 97 30 C 99 19 109 11 119 6 C 111 15 107 23 102 30 Z" fill="#113016" />
    </g>
    <g transform="translate(340, 402)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 10 9 19 19 19 30 Z" fill="#113016" />
      <path d="M 27 30 C 31 13 41 2 53 0 C 43 9 36 19 31 30 Z" fill="#4ADE80" />
      <path d="M 43 30 C 46 17 55 9 65 4 C 58 13 53 21 48 30 Z" fill="#227E1F" />
      <path d="M 60 30 C 65 15 75 6 87 2 C 77 11 70 19 65 30 Z" fill="#318116" />
      <path d="M 77 30 C 79 19 89 11 99 6 C 91 15 87 23 82 30 Z" fill="#4ADE80" />
      <path d="M 92 30 C 94 21 104 13 113 9 C 106 17 101 23 97 30 Z" fill="#113016" />
    </g>
  </g>
</svg>
