<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Bright Emerald Green (Big 'F' - 1AD Canonical) -->
    <linearGradient id="brightEmeraldGrad1av" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#2EA055" />
      <stop offset="100%" stop-color="#1E7A3E" />
    </linearGradient>

    <linearGradient id="brightEmeraldCapLeft1av" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EA055" />
      <stop offset="50%" stop-color="#3DC06F" />
      <stop offset="100%" stop-color="#6EE7A0" />
    </linearGradient>

    <linearGradient id="brightEmeraldCapRight1av" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA055" />
      <stop offset="50%" stop-color="#1B7A45" />
      <stop offset="100%" stop-color="#12562F" />
    </linearGradient>

    <!-- Muted Sage-Spruce Green (Small 'F' - 1AD Canonical) -->
    <linearGradient id="sageSpruceGrad1av" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C8564" />
      <stop offset="45%" stop-color="#366A4D" />
      <stop offset="100%" stop-color="#254F38" />
    </linearGradient>

    <linearGradient id="sageSpruceCapLeft1av" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#366A4D" />
      <stop offset="50%" stop-color="#4A8462" />
      <stop offset="100%" stop-color="#619E7A" />
    </linearGradient>

    <linearGradient id="sageSpruceCapRight1av" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#366A4D" />
      <stop offset="50%" stop-color="#28543B" />
      <stop offset="100%" stop-color="#1A3E2A" />
    </linearGradient>

    <!-- Warm Golden-Brown Pressure Treated Tone -->
    <linearGradient id="ptWarmWoodGrad1av" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="35%" stop-color="#754E36" />
      <stop offset="75%" stop-color="#633F2A" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <!-- Rich Earth Brown Soil Gradient -->
    <linearGradient id="soilGrad1av" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A542E" />
      <stop offset="40%" stop-color="#6A481B" />
      <stop offset="100%" stop-color="#4E3114" />
    </linearGradient>

    <!-- ======================================================== -->
    <!-- CONCEPT 1AV: 3-4-3-4 WITH EXTRA VERTICAL BREATHING ROOM (46px) & CRISP INCISION BLADES -->
    <!-- ======================================================== -->

    <!-- Post Pattern (76px wide × 46px tall): Row 1 = 3 ticks, Row 2 = 4 ticks -->
    <pattern id="pt-grid-post-1av" x="56" y="0" width="76" height="46" patternUnits="userSpaceOnUse">
      <!-- Row 1 (3 Ticks at x=14, 38, 62, y=6) -->
      <rect x="12.5" y="6" width="3.2" height="11" rx="1" fill="#140601" opacity="0.95" />
      <rect x="36.5" y="6" width="3.2" height="11" rx="1" fill="#140601" opacity="0.95" />
      <rect x="60.5" y="6" width="3.2" height="11" rx="1" fill="#140601" opacity="0.95" />

      <!-- Row 2 (4 Ticks at x=10, 28, 46, 64, y=29) -->
      <rect x="8.5" y="29" width="3.2" height="11" rx="1" fill="#140601" opacity="0.95" />
      <rect x="26.5" y="29" width="3.2" height="11" rx="1" fill="#140601" opacity="0.95" />
      <rect x="44.5" y="29" width="3.2" height="11" rx="1" fill="#140601" opacity="0.95" />
      <rect x="62.5" y="29" width="3.2" height="11" rx="1" fill="#140601" opacity="0.95" />
    </pattern>

    <!-- Rail Pattern (46px wide × 68px tall): Col 1 = 3 ticks, Col 2 = 4 ticks -->
    <pattern id="pt-grid-rail-1av" x="0" y="54" width="46" height="68" patternUnits="userSpaceOnUse">
      <!-- Col 1 (3 Horizontal Ticks at y=10, 32, 54, x=6) -->
      <rect x="6" y="8.5" width="11" height="3.2" rx="1" fill="#140601" opacity="0.95" />
      <rect x="6" y="30.5" width="11" height="3.2" rx="1" fill="#140601" opacity="0.95" />
      <rect x="6" y="52.5" width="11" height="3.2" rx="1" fill="#140601" opacity="0.95" />

      <!-- Col 2 (4 Horizontal Ticks at y=6, 22, 38, 54, x=29) -->
      <rect x="29" y="4.5" width="11" height="3.2" rx="1" fill="#140601" opacity="0.95" />
      <rect x="29" y="20.5" width="11" height="3.2" rx="1" fill="#140601" opacity="0.95" />
      <rect x="29" y="36.5" width="11" height="3.2" rx="1" fill="#140601" opacity="0.95" />
      <rect x="29" y="52.5" width="11" height="3.2" rx="1" fill="#140601" opacity="0.95" />
    </pattern>

    <!-- Soft Depth Shadow -->
    <filter id="shadow1av" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 100% PURE TRANSPARENT CANVAS -->
  <!-- 1AD CANONICAL MONOGRAM (BRIGHT EMERALD BIG 'F' + SAGE-SPRUCE SMALL 'F') -->
  <!-- 3-4-3-4 PRESSURE TREATED TIMBER PATTERN (46px EXTRA SPACING & DEEP SLITS) -->
  <!-- 16px FRAMED DIRT BAR (y=428..444) WITH 4-SIDED BLACK OUTLINE + BLACK ENDCAPS -->
  <!-- 3 ORIGINAL 1AD GRASS TUFTS (ROOTS CENTERED VERTICALLY AT y=436) -->
  <!-- ======================================================== -->
  <g filter="url(#shadow1av)">

    <!-- ======================================================== -->
    <!-- 1ST BIG 'F' (BRIGHT EMERALD GREEN #2EA055) -->
    <!-- ======================================================== -->
    <g id="Big-F-Bright-Emerald">
      
      <!-- Outer Black Keyline Layer -->
      <path d="M 56 54 L 132 54 L 434 54 C 440 54 444 58 444 64 L 444 112 C 444 118 440 122 434 122 L 132 122 L 132 196 L 192 196 L 192 260 L 132 260 L 132 428 L 56 428 Z" 
            fill="none" 
            stroke="#0B0E0C" 
            stroke-width="7.5" 
            stroke-linejoin="round" />

      <!-- Bright Emerald Green Outline & Timber Fill -->
      <path d="M 56 54 L 132 54 L 434 54 C 440 54 444 58 444 64 L 444 112 C 444 118 440 122 434 122 L 132 122 L 132 196 L 192 196 L 192 260 L 132 260 L 132 428 L 56 428 Z" 
            fill="url(#ptWarmWoodGrad1av)" 
            stroke="#2EA055" 
            stroke-width="4.5" 
            stroke-linejoin="round" />

      <!-- Timber Incision Texture Overlay (3-4-3-4 Extra Spacing) -->
      <rect x="58" y="56" width="72" height="370" fill="url(#pt-grid-post-1av)" />
      <rect x="134" y="56" width="298" height="64" fill="url(#pt-grid-rail-1av)" />
      <rect x="134" y="198" width="56" height="60" fill="url(#pt-grid-rail-1av)" />

      <!-- Top Micro Trim -->
      <path d="M 434 54 L 438 54 C 442 54 444 58 444 64 L 444 112 C 444 118 442 122 438 122 L 434 122 Z" 
            fill="url(#brightEmeraldGrad1av)" 
            stroke="#0B0E0C" 
            stroke-width="1.2" />

      <!-- Post 1 Pyramid Cap -->
      <rect x="46" y="48" width="96" height="8" rx="3" fill="#2EA055" stroke="#0B0E0C" stroke-width="2.5" />
      <path d="M 48 48 L 94 28 L 94 48 Z" fill="url(#brightEmeraldCapLeft1av)" stroke="#0B0E0C" stroke-width="2" stroke-linejoin="round" />
      <path d="M 94 28 L 140 48 L 94 48 Z" fill="url(#brightEmeraldCapRight1av)" stroke="#0B0E0C" stroke-width="2" stroke-linejoin="round" />
      <circle cx="94" cy="28" r="3" fill="#6EE7A0" stroke="#0B0E0C" stroke-width="1.5" />

      <!-- Fine 2px Black Internal Carpentry Seams -->
      <line x1="132" y1="54" x2="132" y2="122" stroke="#0B0E0C" stroke-width="2" />
      <line x1="132" y1="196" x2="132" y2="260" stroke="#0B0E0C" stroke-width="2" />
      <line x1="192" y1="196" x2="192" y2="260" stroke="#0B0E0C" stroke-width="2" />
    </g>


    <!-- ======================================================== -->
    <!-- 2ND SMALL 'F' (MUTED SAGE-SPRUCE GREEN #366A4D) -->
    <!-- ======================================================== -->
    <g id="Small-F-Muted-Sage-Spruce">

      <!-- Outer Black Keyline Layer -->
      <path d="M 192 196 L 268 196 L 406 196 C 410 196 414 200 414 206 L 414 250 C 414 256 410 260 406 260 L 268 260 L 268 312 L 370 312 C 374 312 378 316 378 321 L 378 357 C 378 362 374 366 370 366 L 268 366 L 268 428 L 192 428 Z" 
            fill="none" 
            stroke="#0B0E0C" 
            stroke-width="7.5" 
            stroke-linejoin="round" />

      <!-- Muted Sage-Spruce Green Outline & Timber Fill -->
      <path d="M 192 196 L 268 196 L 406 196 C 410 196 414 200 414 206 L 414 250 C 414 256 410 260 406 260 L 268 260 L 268 312 L 370 312 C 374 312 378 316 378 321 L 378 357 C 378 362 374 366 370 366 L 268 366 L 268 428 L 192 428 Z" 
            fill="url(#ptWarmWoodGrad1av)" 
            stroke="#366A4D" 
            stroke-width="4.5" 
            stroke-linejoin="round" />

      <!-- Timber Incision Texture Overlay (3-4-3-4 Extra Spacing) -->
      <rect x="194" y="198" width="72" height="228" fill="url(#pt-grid-post-1av)" />
      <rect x="270" y="198" width="134" height="60" fill="url(#pt-grid-rail-1av)" />
      <rect x="270" y="314" width="98" height="50" fill="url(#pt-grid-rail-1av)" />

      <!-- Micro Muted Sage-Spruce End Trims -->
      <path d="M 406 196 L 408 196 C 412 196 414 200 414 206 L 414 250 C 414 256 412 260 408 260 L 406 260 Z" 
            fill="url(#sageSpruceGrad1av)" 
            stroke="#0B0E0C" 
            stroke-width="1.2" />

      <path d="M 370 312 L 372 312 C 376 312 378 316 378 321 L 378 357 C 378 362 376 366 372 366 L 370 366 Z" 
            fill="url(#sageSpruceGrad1av)" 
            stroke="#0B0E0C" 
            stroke-width="1.2" />

      <!-- Post 2 Pyramid Cap -->
      <rect x="182" y="190" width="96" height="8" rx="3" fill="#366A4D" stroke="#0B0E0C" stroke-width="2.5" />
      <path d="M 184 190 L 230 170 L 230 190 Z" fill="url(#sageSpruceCapLeft1av)" stroke="#0B0E0C" stroke-width="2" stroke-linejoin="round" />
      <path d="M 230 170 L 276 190 L 230 190 Z" fill="url(#sageSpruceCapRight1av)" stroke="#0B0E0C" stroke-width="2" stroke-linejoin="round" />
      <circle cx="230" cy="170" r="3" fill="#619E7A" stroke="#0B0E0C" stroke-width="1.5" />

      <!-- Fine 2px Black Internal Carpentry Seams -->
      <line x1="268" y1="196" x2="268" y2="260" stroke="#0B0E0C" stroke-width="2" />
      <line x1="268" y1="312" x2="268" y2="366" stroke="#0B0E0C" stroke-width="2" />
    </g>


    <!-- ======================================================== -->
    <!-- 16px FRAMED DIRT LINE (y=428..444) -->
    <!-- With 4-Sided Black Outline, Rounded Corners & Black Micro Endcaps -->
    <!-- ======================================================== -->
    <g id="Framed-Dirt-Baseplate-1av">
      
      <!-- Main Earth Soil Body (y=428..444, 16px tall) with 4-Sided Black Outline & Rounded Corners -->
      <rect x="42" y="428" width="428" height="16" rx="4" fill="url(#soilGrad1av)" stroke="#0B0E0C" stroke-width="2" />

      <!-- Left Black Micro Endcap (x=34..42, y=428..444) -->
      <path d="M 42 428 L 38 428 C 35.5 428 34 430.5 34 436 C 34 441.5 35.5 444 38 444 L 42 444 Z" 
            fill="#0B0E0C" 
            stroke="#0B0E0C" 
            stroke-width="1.2" 
            stroke-linejoin="round" />

      <!-- Right Black Micro Endcap (x=470..478, y=428..444) -->
      <path d="M 470 428 L 474 428 C 476.5 428 478 430.5 478 436 C 478 441.5 476.5 444 474 444 L 470 444 Z" 
            fill="#0B0E0C" 
            stroke="#0B0E0C" 
            stroke-width="1.2" 
            stroke-linejoin="round" />

      <!-- Subtle Seam Lines at Endcap Joints -->
      <line x1="42" y1="428" x2="42" y2="444" stroke="#0B0E0C" stroke-width="1.2" />
      <line x1="470" y1="428" x2="470" y2="444" stroke="#0B0E0C" stroke-width="1.2" />
    </g>

  </g>

  <!-- ======================================================== -->
  <!-- 3 ORIGINAL 1AD GRASS TUFTS (ROOTS CENTERED VERTICALLY AT y=436) -->
  <!-- Left tuft, Center tuft, Right tuft -->
  <!-- ======================================================== -->
  <g id="Front-Grass-Layer-1av" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))">

    <!-- TUFT 1: ORIGINAL LEFT TUFT (x=28..130) -->
    <g transform="translate(28, 406)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 9 9 18 19 18 30 Z" fill="#0C3D20" />
      <path d="M 22 30 C 24 15 31 4 38 0 C 33 9 29 19 26 30 Z" fill="#1B7A45" />
      <path d="M 34 30 C 36 11 46 2 58 0 C 48 9 43 19 38 30 Z" fill="#4ADE80" />
      <path d="M 46 30 C 43 17 38 9 31 2 C 41 9 48 19 50 30 Z" fill="#28874B" />
      <path d="M 56 30 C 60 13 67 2 77 0 C 70 11 62 21 60 30 Z" fill="#1B7A45" />
      <path d="M 66 30 C 68 17 75 9 85 4 C 77 13 72 21 70 30 Z" fill="#4ADE80" />
      <path d="M 80 30 C 82 19 92 11 102 6 C 94 15 90 23 85 30 Z" fill="#0C3D20" />
    </g>

    <!-- TUFT 2: ORIGINAL CENTER TUFT (x=164..283) -->
    <g transform="translate(164, 406)">
      <path d="M 12 30 C 10 17 2 9 0 2 C 10 9 17 19 17 30 Z" fill="#1B7A45" />
      <path d="M 22 30 C 27 13 34 2 44 0 C 36 9 31 19 26 30 Z" fill="#4ADE80" />
      <path d="M 36 30 C 39 17 46 9 56 4 C 48 13 43 21 41 30 Z" fill="#0C3D20" />
      <path d="M 53 30 C 51 13 46 4 39 0 C 48 6 56 17 58 30 Z" fill="#28874B" />
      <path d="M 65 30 C 70 11 80 2 92 0 C 82 9 75 19 70 30 Z" fill="#4ADE80" />
      <path d="M 82 30 C 84 17 94 9 104 4 C 96 13 92 21 87 30 Z" fill="#1B7A45" />
      <path d="M 97 30 C 99 19 109 11 119 6 C 111 15 107 23 102 30 Z" fill="#0C3D20" />
    </g>

    <!-- TUFT 3: ORIGINAL RIGHT TUFT (x=340..453) -->
    <g transform="translate(340, 406)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 10 9 19 19 19 30 Z" fill="#0C3D20" />
      <path d="M 27 30 C 31 13 41 2 53 0 C 43 9 36 19 31 30 Z" fill="#4ADE80" />
      <path d="M 43 30 C 46 17 55 9 65 4 C 58 13 53 21 48 30 Z" fill="#1B7A45" />
      <path d="M 60 30 C 65 15 75 6 87 2 C 77 11 70 19 65 30 Z" fill="#28874B" />
      <path d="M 77 30 C 79 19 89 11 99 6 C 91 15 87 23 82 30 Z" fill="#4ADE80" />
      <path d="M 92 30 C 94 21 104 13 113 9 C 106 17 101 23 97 30 Z" fill="#0C3D20" />
    </g>

  </g>
</svg>
