<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sun Gold Gradient -->
    <linearGradient id="goldCapGrad1s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE18B" />
      <stop offset="45%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#C29424" />
    </linearGradient>

    <linearGradient id="goldSlopeLeft1s" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B842" />
      <stop offset="60%" stop-color="#FCE18B" />
      <stop offset="100%" stop-color="#FFF3C4" />
    </linearGradient>

    <linearGradient id="goldSlopeRight1s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B842" />
      <stop offset="50%" stop-color="#C29424" />
      <stop offset="100%" stop-color="#9A7214" />
    </linearGradient>

    <!-- Darkened Emerald Green Gradient (Slightly Darkened, Rich PNW Tone) -->
    <linearGradient id="greenSlopeLeft1s" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B7A45" />
      <stop offset="50%" stop-color="#2EA055" />
      <stop offset="100%" stop-color="#3DC06F" />
    </linearGradient>

    <linearGradient id="greenSlopeRight1s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7A45" />
      <stop offset="50%" stop-color="#146336" />
      <stop offset="100%" stop-color="#0E4826" />
    </linearGradient>

    <!-- Warm Golden-Brown Pressure Treated Tone -->
    <linearGradient id="ptWarmWoodGrad1s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="35%" stop-color="#754E36" />
      <stop offset="75%" stop-color="#633F2A" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <linearGradient id="ptWarmRailGrad1s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="45%" stop-color="#754E36" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <!-- Precision Incision Grid for Posts -->
    <pattern id="pt-grid-post-1s" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="17" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="10.5" y="21" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <!-- Precision Incision Grid for Rails -->
    <pattern id="pt-grid-rail-1s" width="34" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="4" y="17" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="21" y="10.5" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <!-- Soft Depth Shadow -->
    <filter id="shadow1s" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 100% PURE TRANSPARENT CANVAS -->
  <!-- WIDER & SLIGHTLY TALLER POST CAPS (OVERHANGING POSTS) -->
  <!-- POST 1: SUN GOLD CAP • POST 2: DARKENED EMERALD GREEN CAP -->
  <!-- ======================================================== -->
  <g filter="url(#shadow1s)">
    
    <!-- POST 1: TALL LEFT VERTICAL PT 4x4 POST (Width = 76px) -->
    <rect x="56" y="54" width="76" height="370" rx="4" fill="url(#ptWarmWoodGrad1s)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="58" y="56" width="72" height="366" fill="url(#pt-grid-post-1s)" />

    <!-- TOP RAIL: 1ST "F" TOP BEAM (Tucked Under Post 1 Cap) -->
    <rect x="132" y="54" width="308" height="68" rx="6" fill="url(#ptWarmRailGrad1s)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="134" y="56" width="304" height="64" fill="url(#pt-grid-rail-1s)" />
    <!-- Gold End Trim Bracket -->
    <path d="M 420 54 L 440 54 C 446 54 450 58 450 64 L 450 112 C 450 118 446 122 440 122 L 420 122 Z" fill="url(#goldCapGrad1s)" stroke="#0B0E0C" stroke-width="3" />


    <!-- POST 1 CAP: SUN GOLD WIDE PYRAMID CAP (96px Wide, 20px Rise) -->
    <!-- Base Skirt (Overhangs post by 10px on both sides) -->
    <rect x="46" y="48" width="96" height="8" rx="3" fill="#E5B842" stroke="#0B0E0C" stroke-width="3" />
    <!-- Pyramid Left Slope -->
    <path d="M 48 48 L 94 28 L 94 48 Z" fill="url(#goldSlopeLeft1s)" stroke="#0B0E0C" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Pyramid Right Slope -->
    <path d="M 94 28 L 140 48 L 94 48 Z" fill="url(#goldSlopeRight1s)" stroke="#0B0E0C" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Soft Rounded Apex Point -->
    <circle cx="94" cy="28" r="3" fill="#FFF3C4" stroke="#0B0E0C" stroke-width="1.5" />


    <!-- MID RAIL SEGMENT 1 (Between Post 1 & Post 2: Forms 1st 'F' Mid Bar) -->
    <rect x="132" y="196" width="60" height="64" rx="4" fill="url(#ptWarmRailGrad1s)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="134" y="198" width="56" height="60" fill="url(#pt-grid-rail-1s)" />
    <!-- Darkened Green Accent Stripe -->
    <rect x="132" y="196" width="60" height="8" fill="#1B7A45" opacity="0.95" />


    <!-- POST 2: SECONDARY PT 4x4 POST (Shifted Left, Width = 76px) -->
    <rect x="192" y="196" width="76" height="228" rx="4" fill="url(#ptWarmWoodGrad1s)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="194" y="198" width="72" height="224" fill="url(#pt-grid-post-1s)" />


    <!-- MID RAIL SEGMENT 2: 2ND "F" TOP BEAM (Extends Right from Post 2) -->
    <rect x="268" y="196" width="144" height="64" rx="6" fill="url(#ptWarmRailGrad1s)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="270" y="198" width="140" height="60" fill="url(#pt-grid-rail-1s)" />
    <!-- Darkened Green Accent Stripe -->
    <rect x="268" y="196" width="144" height="8" fill="#1B7A45" opacity="0.95" />
    <!-- Gold End Cap on 2nd F Top Rail -->
    <path d="M 392 196 L 412 196 C 418 196 422 200 422 206 L 422 250 C 422 256 418 260 412 260 L 392 260 Z" fill="url(#goldCapGrad1s)" stroke="#0B0E0C" stroke-width="3" />


    <!-- POST 2 CAP: DARKENED EMERALD GREEN WIDE PYRAMID CAP (96px Wide, 20px Rise) -->
    <!-- Base Skirt (Overhangs post by 10px on both sides) -->
    <rect x="182" y="190" width="96" height="8" rx="3" fill="#1B7A45" stroke="#0B0E0C" stroke-width="3" />
    <!-- Pyramid Left Slope -->
    <path d="M 184 190 L 230 170 L 230 190 Z" fill="url(#greenSlopeLeft1s)" stroke="#0B0E0C" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Pyramid Right Slope -->
    <path d="M 230 170 L 276 190 L 230 190 Z" fill="url(#greenSlopeRight1s)" stroke="#0B0E0C" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Soft Rounded Apex Point -->
    <circle cx="230" cy="170" r="3" fill="#3DC06F" stroke="#0B0E0C" stroke-width="1.5" />


    <!-- LOWER MID RAIL: 2ND "F" MID BEAM (Positioned at y=312) -->
    <rect x="268" y="312" width="108" height="54" rx="5" fill="url(#ptWarmRailGrad1s)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="270" y="314" width="104" height="50" fill="url(#pt-grid-rail-1s)" />
    <!-- Gold End Trim -->
    <rect x="360" y="312" width="16" height="54" rx="2" fill="url(#goldCapGrad1s)" stroke="#0B0E0C" stroke-width="2" />


    <!-- DIRT / EARTH GROUND BASEPLATE -->
    <rect x="36" y="424" width="440" height="20" rx="5" fill="#6A481B" stroke="#0B0E0C" stroke-width="3" />


    <!-- PRECISION JOINERY FASTENER BOLTS -->
    <!-- Post 1 Top Bolt -->
    <circle cx="94" cy="88" r="8" fill="#0B0E0C" /><circle cx="94" cy="88" r="4.5" fill="#E5B842" />
    
    <!-- Post 1 Mid Bolt -->
    <circle cx="94" cy="228" r="8" fill="#0B0E0C" /><circle cx="94" cy="228" r="4.5" fill="#1B7A45" />
    
    <!-- Post 2 Top / In-Feed Bolt (Left) -->
    <circle cx="212" cy="228" r="7" fill="#0B0E0C" /><circle cx="212" cy="228" r="3.8" fill="#1B7A45" />
    
    <!-- Post 2 Top / Out-Feed Bolt (Right) -->
    <circle cx="248" cy="228" r="7" fill="#0B0E0C" /><circle cx="248" cy="228" r="3.8" fill="#1B7A45" />
    
    <!-- Post 2 Lower Mid Bolt -->
    <circle cx="230" cy="339" r="7.5" fill="#0B0E0C" /><circle cx="230" cy="339" r="4" fill="#E5B842" />
  </g>

  <!-- ======================================================== -->
  <!-- PACIFIC NORTHWEST NATURAL GRASS BLADES -->
  <!-- Grounding the structure with natural emerald blades -->
  <!-- ======================================================== -->
  <g id="Front-Grass-Layer-1s" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))">
    <g transform="translate(28, 402)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 9 9 18 19 18 30 Z" fill="#113016" />
      <path d="M 22 30 C 24 15 31 4 38 0 C 33 9 29 19 26 30 Z" fill="#227E1F" />
      <path d="M 34 30 C 36 11 46 2 58 0 C 48 9 43 19 38 30 Z" fill="#4ADE80" />
      <path d="M 46 30 C 43 17 38 9 31 2 C 41 9 48 19 50 30 Z" fill="#318116" />
      <path d="M 56 30 C 60 13 67 2 77 0 C 70 11 62 21 60 30 Z" fill="#227E1F" />
      <path d="M 66 30 C 68 17 75 9 85 4 C 77 13 72 21 70 30 Z" fill="#4ADE80" />
      <path d="M 80 30 C 82 19 92 11 102 6 C 94 15 90 23 85 30 Z" fill="#113016" />
    </g>
    <g transform="translate(164, 402)">
      <path d="M 12 30 C 10 17 2 9 0 2 C 10 9 17 19 17 30 Z" fill="#227E1F" />
      <path d="M 22 30 C 27 13 34 2 44 0 C 36 9 31 19 26 30 Z" fill="#4ADE80" />
      <path d="M 36 30 C 39 17 46 9 56 4 C 48 13 43 21 41 30 Z" fill="#113016" />
      <path d="M 53 30 C 51 13 46 4 39 0 C 48 6 56 17 58 30 Z" fill="#318116" />
      <path d="M 65 30 C 70 11 80 2 92 0 C 82 9 75 19 70 30 Z" fill="#4ADE80" />
      <path d="M 82 30 C 84 17 94 9 104 4 C 96 13 92 21 87 30 Z" fill="#227E1F" />
      <path d="M 97 30 C 99 19 109 11 119 6 C 111 15 107 23 102 30 Z" fill="#113016" />
    </g>
    <g transform="translate(340, 402)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 10 9 19 19 19 30 Z" fill="#113016" />
      <path d="M 27 30 C 31 13 41 2 53 0 C 43 9 36 19 31 30 Z" fill="#4ADE80" />
      <path d="M 43 30 C 46 17 55 9 65 4 C 58 13 53 21 48 30 Z" fill="#227E1F" />
      <path d="M 60 30 C 65 15 75 6 87 2 C 77 11 70 19 65 30 Z" fill="#318116" />
      <path d="M 77 30 C 79 19 89 11 99 6 C 91 15 87 23 82 30 Z" fill="#4ADE80" />
      <path d="M 92 30 C 94 21 104 13 113 9 C 106 17 101 23 97 30 Z" fill="#113016" />
    </g>
  </g>
</svg>
