<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sun Gold Gradient -->
    <linearGradient id="goldGrad1p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE18B" />
      <stop offset="45%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#C29424" />
    </linearGradient>

    <!-- Warm Golden-Brown Pressure Treated Tone -->
    <linearGradient id="ptWarmWoodGrad1p" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="35%" stop-color="#754E36" />
      <stop offset="75%" stop-color="#633F2A" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <linearGradient id="ptWarmRailGrad1p" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="45%" stop-color="#754E36" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <!-- Ultra-Low Pitch Wood Cap Gradient -->
    <linearGradient id="woodCapGradSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#996E50" />
      <stop offset="40%" stop-color="#845A3E" />
      <stop offset="100%" stop-color="#5C3B26" />
    </linearGradient>

    <pattern id="pt-grid-post-1p" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="17" y="4" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="10.5" y="21" width="2.5" height="9" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <pattern id="pt-grid-rail-1p" width="34" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="4" y="17" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
      <rect x="21" y="10.5" width="9" height="2.5" rx="0.5" fill="#381E11" opacity="0.75" />
    </pattern>

    <filter id="shadow1p" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ULTRA-SOFT ROUNDED WOODEN CAPS -->
  <g filter="url(#shadow1p)">
    
    <!-- POST 1: TALL HERO POST -->
    <rect x="56" y="48" width="76" height="376" rx="4" fill="url(#ptWarmWoodGrad1p)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="58" y="50" width="72" height="372" fill="url(#pt-grid-post-1p)" />

    <!-- TOP RAIL -->
    <rect x="132" y="48" width="308" height="68" rx="6" fill="url(#ptWarmRailGrad1p)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="134" y="50" width="304" height="64" fill="url(#pt-grid-rail-1p)" />
    <path d="M 420 48 L 440 48 C 446 48 450 52 450 58 L 450 106 C 450 112 446 116 440 116 L 420 116 Z" fill="url(#goldGrad1p)" stroke="#0B0E0C" stroke-width="3" />

    <!-- ULTRA-SOFT WOOD CAP 1 (10px height, rounded eaves) -->
    <path d="M 50 48 L 52 44 Q 94 36 136 44 L 138 48 Z" fill="url(#woodCapGradSoft)" stroke="#0B0E0C" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="48" y="44" width="92" height="6" rx="3" fill="#633F2A" stroke="#0B0E0C" stroke-width="2" />

    <!-- MID RAIL SEGMENT 1 -->
    <rect x="132" y="190" width="60" height="64" rx="4" fill="url(#ptWarmRailGrad1p)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="134" y="192" width="56" height="60" fill="url(#pt-grid-rail-1p)" />
    <rect x="132" y="190" width="60" height="8" fill="#4ADE80" opacity="0.95" />

    <!-- POST 2 -->
    <rect x="192" y="190" width="76" height="234" rx="4" fill="url(#ptWarmWoodGrad1p)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="194" y="192" width="72" height="230" fill="url(#pt-grid-post-1p)" />

    <!-- MID RAIL SEGMENT 2 -->
    <rect x="268" y="190" width="144" height="64" rx="6" fill="url(#ptWarmRailGrad1p)" stroke="#0B0E0C" stroke-width="4" />
    <rect x="270" y="192" width="140" height="60" fill="url(#pt-grid-rail-1p)" />
    <rect x="268" y="190" width="144" height="8" fill="#4ADE80" opacity="0.95" />
    <path d="M 392 190 L 412 190 C 418 190 422 194 422 200 L 422 244 C 422 250 418 254 412 254 L 392 254 Z" fill="url(#goldGrad1p)" stroke="#0B0E0C" stroke-width="3" />

    <!-- ULTRA-SOFT WOOD CAP 2 -->
    <path d="M 186 190 L 188 186 Q 230 178 272 186 L 274 190 Z" fill="url(#woodCapGradSoft)" stroke="#0B0E0C" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="184" y="186" width="92" height="6" rx="3" fill="#633F2A" stroke="#0B0E0C" stroke-width="2" />

    <!-- LOWER MID RAIL -->
    <rect x="268" y="308" width="108" height="54" rx="5" fill="url(#ptWarmRailGrad1p)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="270" y="310" width="104" height="50" fill="url(#pt-grid-rail-1p)" />
    <rect x="360" y="308" width="16" height="54" rx="2" fill="url(#goldGrad1p)" stroke="#0B0E0C" stroke-width="2" />

    <!-- DIRT BASEPLATE -->
    <rect x="36" y="424" width="440" height="20" rx="5" fill="#6A481B" stroke="#0B0E0C" stroke-width="3" />

    <!-- FASTENERS -->
    <circle cx="94" cy="82" r="8" fill="#0B0E0C" /><circle cx="94" cy="82" r="4.5" fill="#E5B842" />
    <circle cx="94" cy="222" r="8" fill="#0B0E0C" /><circle cx="94" cy="222" r="4.5" fill="#4ADE80" />
    <circle cx="212" cy="222" r="7" fill="#0B0E0C" /><circle cx="212" cy="222" r="3.8" fill="#4ADE80" />
    <circle cx="248" cy="222" r="7" fill="#0B0E0C" /><circle cx="248" cy="222" r="3.8" fill="#4ADE80" />
    <circle cx="230" cy="335" r="7.5" fill="#0B0E0C" /><circle cx="230" cy="335" r="4" fill="#E5B842" />
  </g>

  <!-- NATURAL GRASS -->
  <g id="GrassLayer1p" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))">
    <g transform="translate(28, 402)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 9 9 18 19 18 30 Z" fill="#113016" />
      <path d="M 22 30 C 24 15 31 4 38 0 C 33 9 29 19 26 30 Z" fill="#227E1F" />
      <path d="M 34 30 C 36 11 46 2 58 0 C 48 9 43 19 38 30 Z" fill="#4ADE80" />
      <path d="M 46 30 C 43 17 38 9 31 2 C 41 9 48 19 50 30 Z" fill="#318116" />
      <path d="M 56 30 C 60 13 67 2 77 0 C 70 11 62 21 60 30 Z" fill="#227E1F" />
      <path d="M 66 30 C 68 17 75 9 85 4 C 77 13 72 21 70 30 Z" fill="#4ADE80" />
      <path d="M 80 30 C 82 19 92 11 102 6 C 94 15 90 23 85 30 Z" fill="#113016" />
    </g>
    <g transform="translate(164, 402)">
      <path d="M 12 30 C 10 17 2 9 0 2 C 10 9 17 19 17 30 Z" fill="#227E1F" />
      <path d="M 22 30 C 27 13 34 2 44 0 C 36 9 31 19 26 30 Z" fill="#4ADE80" />
      <path d="M 36 30 C 39 17 46 9 56 4 C 48 13 43 21 41 30 Z" fill="#113016" />
      <path d="M 53 30 C 51 13 46 4 39 0 C 48 6 56 17 58 30 Z" fill="#318116" />
      <path d="M 65 30 C 70 11 80 2 92 0 C 82 9 75 19 70 30 Z" fill="#4ADE80" />
      <path d="M 82 30 C 84 17 94 9 104 4 C 96 13 92 21 87 30 Z" fill="#227E1F" />
      <path d="M 97 30 C 99 19 109 11 119 6 C 111 15 107 23 102 30 Z" fill="#113016" />
    </g>
    <g transform="translate(340, 402)">
      <path d="M 14 30 C 12 18 5 6 0 0 C 10 9 19 19 19 30 Z" fill="#113016" />
      <path d="M 27 30 C 31 13 41 2 53 0 C 43 9 36 19 31 30 Z" fill="#4ADE80" />
      <path d="M 43 30 C 46 17 55 9 65 4 C 58 13 53 21 48 30 Z" fill="#227E1F" />
      <path d="M 60 30 C 65 15 75 6 87 2 C 77 11 70 19 65 30 Z" fill="#318116" />
      <path d="M 77 30 C 79 19 89 11 99 6 C 91 15 87 23 82 30 Z" fill="#4ADE80" />
      <path d="M 92 30 C 94 21 104 13 113 9 C 106 17 101 23 97 30 Z" fill="#113016" />
    </g>
  </g>
</svg>
