<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Ink Forest Gradient -->
    <linearGradient id="bgGrad1c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E0C" />
      <stop offset="60%" stop-color="#111A14" />
      <stop offset="100%" stop-color="#16432D" />
    </linearGradient>

    <!-- Sun Gold Luster -->
    <linearGradient id="goldGrad1c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE18B" />
      <stop offset="50%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#C29424" />
    </linearGradient>

    <!-- Pressure Treated Wood Tone -->
    <linearGradient id="ptPostGrad1c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#845A42" />
      <stop offset="35%" stop-color="#6C4834" />
      <stop offset="70%" stop-color="#553624" />
      <stop offset="100%" stop-color="#422718" />
    </linearGradient>

    <!-- Cedar / Gold Hybrid Rail Tone -->
    <linearGradient id="hybridRailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B842" />
      <stop offset="40%" stop-color="#D49E28" />
      <stop offset="100%" stop-color="#7B533E" />
    </linearGradient>

    <pattern id="pt-incised-1c" width="22" height="32" patternUnits="userSpaceOnUse">
      <rect x="3" y="2" width="2.5" height="10" rx="1" fill="#1C0E08" opacity="0.85" />
      <rect x="14" y="6" width="2.5" height="10" rx="1" fill="#140A05" opacity="0.9" />
      <rect x="9" y="18" width="2.5" height="10" rx="1" fill="#1C0E08" opacity="0.85" />
      <line x1="5.5" y1="2" x2="5.5" y2="12" stroke="#9E785A" stroke-width="0.8" opacity="0.6" />
      <line x1="16.5" y1="6" x2="16.5" y2="16" stroke="#9E785A" stroke-width="0.8" opacity="0.6" />
    </pattern>

    <filter id="shadow1c" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1c)" />
  <rect width="498" height="498" x="7" y="7" rx="105" fill="none" stroke="#E5B842" stroke-width="4" stroke-opacity="0.4" />

  <!-- Blueprint Matrix Lines -->
  <g opacity="0.08" stroke="#4ADE80" stroke-width="2" stroke-dasharray="6 6">
    <line x1="96" y1="32" x2="96" y2="480" />
    <line x1="256" y1="32" x2="256" y2="480" />
    <line x1="416" y1="32" x2="416" y2="480" />
    <line x1="32" y1="96" x2="480" y2="96" />
    <line x1="32" y1="256" x2="480" y2="256" />
    <line x1="32" y1="416" x2="480" y2="416" />
  </g>

  <!-- Outside Corner Brackets -->
  <path d="M 32 110 L 32 32 L 110 32 L 92 50 L 50 50 L 50 92 Z" fill="#E5B842" />
  <path d="M 480 402 L 480 480 L 402 480 L 420 462 L 462 462 L 462 420 Z" fill="#4ADE80" />

  <!-- DOUBLE-F MONOGRAM STRUCTURE -->
  <g filter="url(#shadow1c)">
    <!-- Primary Left Post (PT 4x4 with Incised Texture & Gold Cap) -->
    <path d="M 94 110 L 128 80 L 162 110 Z" fill="url(#goldGrad1c)" stroke="#0B0E0C" stroke-width="2" />
    <rect x="90" y="110" width="76" height="12" rx="3" fill="#E5B842" stroke="#0B0E0C" stroke-width="2" />

    <rect x="96" y="122" width="64" height="294" rx="4" fill="url(#ptPostGrad1c)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="98" y="124" width="60" height="290" fill="url(#pt-incised-1c)" />
    <line x1="130" y1="124" x2="130" y2="414" stroke="#FAF6EE" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="146" y="124" width="14" height="290" fill="#000000" opacity="0.25" />

    <!-- Top Rail (Sun Gold Architectural Timber) -->
    <path d="M 160 134 L 400 134 C 408 134 414 140 414 148 L 414 186 C 414 194 408 200 400 200 L 160 200 Z" fill="url(#goldGrad1c)" stroke="#0B0E0C" stroke-width="3.5" />
    <!-- Rail Inset Texture -->
    <rect x="162" y="142" width="232" height="42" fill="url(#pt-incised-1c)" opacity="0.25" />
    <line x1="162" y1="144" x2="394" y2="144" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" />

    <!-- Secondary Center Post (PT 4x4) -->
    <path d="M 236 198 L 268 170 L 300 198 Z" fill="url(#goldGrad1c)" stroke="#0B0E0C" stroke-width="2" />
    <rect x="232" y="198" width="72" height="10" rx="2" fill="#E5B842" stroke="#0B0E0C" stroke-width="2" />

    <rect x="236" y="208" width="64" height="208" rx="4" fill="url(#ptPostGrad1c)" stroke="#0B0E0C" stroke-width="3.5" />
    <rect x="238" y="210" width="60" height="204" fill="url(#pt-incised-1c)" />
    <line x1="270" y1="210" x2="270" y2="414" stroke="#FAF6EE" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="286" y="210" width="14" height="204" fill="#000000" opacity="0.25" />

    <!-- Mid Rail (Bright Green / Forest Architectural Beam) -->
    <path d="M 160 248 L 380 248 C 388 248 394 254 394 262 L 394 298 C 394 306 388 312 380 312 L 160 312 Z" fill="#16432D" stroke="#4ADE80" stroke-width="3.5" />
    <rect x="162" y="250" width="216" height="58" fill="url(#pt-incised-1c)" opacity="0.3" />
    <rect x="160" y="248" width="220" height="8" fill="#4ADE80" />

    <!-- Lower Mid Rail (Sun Gold Beam) -->
    <path d="M 300 344 L 370 344 C 376 344 380 348 380 354 L 380 388 C 380 394 376 398 370 398 L 300 398 Z" fill="url(#goldGrad1c)" stroke="#0B0E0C" stroke-width="3" />

    <!-- Dirt & Timber Foundation Baseplate -->
    <rect x="76" y="416" width="360" height="20" rx="4" fill="#6A481B" stroke="#0B0E0C" stroke-width="2.5" />
    <rect x="76" y="428" width="360" height="8" fill="#382010" />

    <!-- Fastener Studs -->
    <circle cx="128" cy="167" r="7" fill="#0B0E0C" /><circle cx="128" cy="167" r="4" fill="#E5B842" />
    <circle cx="128" cy="280" r="7" fill="#0B0E0C" /><circle cx="128" cy="280" r="4" fill="#4ADE80" />
    <circle cx="268" cy="280" r="7" fill="#0B0E0C" /><circle cx="268" cy="280" r="4" fill="#4ADE80" />
    <circle cx="268" cy="371" r="7" fill="#0B0E0C" /><circle cx="268" cy="371" r="4" fill="#E5B842" />
  </g>

  <!-- NATURAL PACIFIC NORTHWEST GRASS LAYER -->
  <g id="GrassLayer1c" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.7))">
    <!-- Continuous Vibrant Grass Run Across Base -->
    <!-- Clump Left -->
    <path d="M 72 424 C 70 410 64 398 58 390 C 66 398 74 410 76 424 Z" fill="#113016" />
    <path d="M 80 424 C 82 408 90 396 100 388 C 92 398 86 410 84 424 Z" fill="#227E1F" />
    <path d="M 92 424 C 96 404 106 392 118 386 C 108 396 102 410 98 424 Z" fill="#4ADE80" />
    <path d="M 106 424 C 104 412 98 402 92 394 C 100 400 108 412 110 424 Z" fill="#318116" />
    <path d="M 118 424 C 122 406 130 392 142 384 C 134 396 126 410 122 424 Z" fill="#4ADE80" />
    <path d="M 130 424 C 132 412 140 402 150 396 C 142 404 136 414 134 424 Z" fill="#227E1F" />
    <path d="M 144 424 C 146 414 154 406 164 400 C 156 408 150 416 148 424 Z" fill="#113016" />

    <!-- Clump Center -->
    <path d="M 204 424 C 202 410 194 400 186 392 C 196 400 204 412 208 424 Z" fill="#227E1F" />
    <path d="M 216 424 C 220 404 230 390 242 382 C 234 394 226 408 222 424 Z" fill="#4ADE80" />
    <path d="M 230 424 C 232 412 238 402 248 396 C 240 404 234 414 232 424 Z" fill="#113016" />
    <path d="M 246 424 C 244 408 238 398 230 390 C 240 398 248 410 252 424 Z" fill="#318116" />
    <path d="M 258 424 C 262 402 272 388 286 380 C 276 392 268 408 264 424 Z" fill="#4ADE80" />
    <path d="M 272 424 C 274 412 282 402 292 396 C 284 404 278 414 276 424 Z" fill="#227E1F" />
    <path d="M 288 424 C 290 416 298 408 308 402 C 300 410 294 418 292 424 Z" fill="#113016" />

    <!-- Clump Right -->
    <path d="M 340 424 C 338 410 330 400 322 392 C 332 400 340 412 344 424 Z" fill="#113016" />
    <path d="M 352 424 C 356 404 366 390 380 382 C 370 394 362 408 358 424 Z" fill="#4ADE80" />
    <path d="M 368 424 C 370 412 378 402 388 396 C 380 404 374 414 372 424 Z" fill="#227E1F" />
    <path d="M 384 424 C 388 408 398 398 410 392 C 400 402 392 414 388 424 Z" fill="#318116" />
    <path d="M 400 424 C 402 414 412 406 422 400 C 414 408 408 416 404 424 Z" fill="#4ADE80" />
    <path d="M 416 424 C 418 418 426 410 434 404 C 426 412 422 418 420 424 Z" fill="#113016" />
  </g>
</svg>
