<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rowdies:wght@700&amp;display=swap');
      .compact-text-fence {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 24px;
        fill: #FFFFFF;
        letter-spacing: 0.03em;
      }
      .compact-text-frames {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 24px;
        fill: #E5B842;
        letter-spacing: 0.03em;
      }
    </style>

    <linearGradient id="emeraldGradCompact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#2EA055" />
      <stop offset="100%" stop-color="#1B7A45" />
    </linearGradient>

    <linearGradient id="goldTanGradCompact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF9E" />
      <stop offset="45%" stop-color="#DEB35E" />
      <stop offset="100%" stop-color="#A87A24" />
    </linearGradient>

    <linearGradient id="woodGradCompact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5E44" />
      <stop offset="35%" stop-color="#754E36" />
      <stop offset="75%" stop-color="#633F2A" />
      <stop offset="100%" stop-color="#52321E" />
    </linearGradient>

    <linearGradient id="soilGradCompact" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A542E" />
      <stop offset="40%" stop-color="#6A481B" />
      <stop offset="100%" stop-color="#4E3114" />
    </linearGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- COMPACT STICKY NAVBAR BRANDMARK -->
  <!-- 38px Icon + 24px Rowdies 700 Wordmark -->
  <!-- ======================================================== -->
  <g id="Compact-Brandmark">
    <!-- Icon scaled to 38px at x=4, y=5 -->
    <g transform="translate(4, 5) scale(0.07421875)">
      <!-- Soil Base -->
      <path d="M 57 412 L 305 412 C 309 412 313.05 414.5 313.05 420 C 313.05 425.5 309 428 305 428 L 57 428 Z" fill="url(#soilGradCompact)" />
      <line x1="57" y1="412" x2="305" y2="412" stroke="#0B0E0C" stroke-width="2.0" />
      <line x1="57" y1="428" x2="305" y2="428" stroke="#0B0E0C" stroke-width="2.0" />

      <!-- Big 'F' -->
      <path d="M 64 54 L 430 54 C 436 54 440 58 440 64 L 440 110 C 440 116 436 120 430 120 L 128 120 L 128 182 L 170 182 L 170 242 L 128 242 L 128 412 L 64 412 Z" fill="none" stroke="#0B0E0C" stroke-width="14.4" stroke-linejoin="round" />
      <path d="M 64 54 L 430 54 C 436 54 440 58 440 64 L 440 110 C 440 116 436 120 430 120 L 128 120 L 128 182 L 170 182 L 170 242 L 128 242 L 128 412 L 64 412 Z" fill="none" stroke="#2EA055" stroke-width="11.4" stroke-linejoin="round" />
      <path d="M 64 54 L 430 54 C 436 54 440 58 440 64 L 440 110 C 440 116 436 120 430 120 L 128 120 L 128 182 L 170 182 L 170 242 L 128 242 L 128 412 L 64 412 Z" fill="url(#woodGradCompact)" stroke="#0B0E0C" stroke-width="3.0" stroke-linejoin="round" />
      <path d="M 430 54 L 434 54 C 438 54 440 58 440 64 L 440 110 C 440 116 438 120 434 120 L 430 120 Z" fill="#0B0E0C" stroke="#0B0E0C" stroke-width="1.2" />

      <!-- Small 'F' -->
      <path d="M 170 182 L 384.35 182 C 388.35 182 392.35 186 392.35 192 L 392.35 232 C 392.35 238 388.35 242 384.35 242 L 234 242 L 234 304 L 339 304 C 343 304 347 308 347 313 L 347 349 C 347 354 343 358 339 358 L 234 358 L 234 412 L 170 412 Z" fill="none" stroke="#0B0E0C" stroke-width="14.4" stroke-linejoin="round" />
      <path d="M 170 182 L 384.35 182 C 388.35 182 392.35 186 392.35 192 L 392.35 232 C 392.35 238 388.35 242 384.35 242 L 234 242 L 234 304 L 339 304 C 343 304 347 308 347 313 L 347 349 C 347 354 343 358 339 358 L 234 358 L 234 412 L 170 412 Z" fill="none" stroke="#DEB35E" stroke-width="11.4" stroke-linejoin="round" />
      <path d="M 170 182 L 384.35 182 C 388.35 182 392.35 186 392.35 192 L 392.35 232 C 392.35 238 388.35 242 384.35 242 L 234 242 L 234 304 L 339 304 C 343 304 347 308 347 313 L 347 349 C 347 354 343 358 339 358 L 234 358 L 234 412 L 170 412 Z" fill="url(#woodGradCompact)" stroke="#0B0E0C" stroke-width="3.0" stroke-linejoin="round" />

      <!-- Post Caps -->
      <rect x="52" y="43" width="88" height="13" rx="3.5" fill="#2EA055" stroke="#0B0E0C" stroke-width="2.8" />
      <path d="M 54 43 L 96 22 L 96 43 Z" fill="#3DC06F" stroke="#0B0E0C" stroke-width="2.2" />
      <path d="M 96 22 L 138 43 L 96 43 Z" fill="#1B7A45" stroke="#0B0E0C" stroke-width="2.2" />
      <rect x="158" y="171" width="88" height="13" rx="3.5" fill="#DEB35E" stroke="#0B0E0C" stroke-width="2.8" />
      <path d="M 160 171 L 202 150 L 202 171 Z" fill="#ECC675" stroke="#0B0E0C" stroke-width="2.2" />
      <path d="M 202 150 L 244 171 L 202 171 Z" fill="#BD9038" stroke="#0B0E0C" stroke-width="2.2" />
    </g>

    <!-- Wordmark -->
    <g transform="translate(48, 32)">
      <text class="compact-text-fence" x="0" y="0">FENCE</text>
      <text class="compact-text-frames" x="88" y="0">FRAMES</text>
    </g>
  </g>
</svg>
