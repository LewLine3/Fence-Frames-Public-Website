<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Rowdies Font Standard -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&amp;display=swap');
      .badge-title {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #FFFFFF;
        letter-spacing: 0.08em;
        text-anchor: middle;
      }
      .badge-sub {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 8.5px;
        fill: #E5B842;
        letter-spacing: 0.14em;
        text-anchor: middle;
      }
      .badge-curved-text {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 9.5px;
        fill: #4ADE80;
        letter-spacing: 0.16em;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="badgeGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="badgeEmeraldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A2B" />
      <stop offset="50%" stop-color="#14261C" />
      <stop offset="100%" stop-color="#0B140E" />
    </linearGradient>

    <linearGradient id="badgeCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Curved Text Paths -->
    <path id="curveTop" d="M 32 120 A 88 88 0 0 1 208 120" fill="none" />
    <path id="curveBottom" d="M 208 120 A 88 88 0 0 1 32 120" fill="none" />
  </defs>

  <!-- ======================================================== -->
  <!-- VERIFIED PRO CONTRACTOR BADGE -->
  <!-- Official Trust Stamp for Vetted Fence Contractors -->
  <!-- ======================================================== -->
  <g id="Verified-Pro-Contractor-Badge" filter="url(#badgeShadow)">

    <!-- 1. Outer Octagonal Gear / Architectural Starburst -->
    <polygon points="120,6 148,18 178,8 198,30 226,30 234,58 252,80 248,110 258,138 242,164 242,192 216,204 204,230 176,230 154,248 124,236 96,248 74,230 46,230 34,204 8,192 8,164 -8,138 2,110 -2,80 16,58 24,30 52,30 72,8 102,18" 
             fill="#0B0E0C" stroke="url(#badgeGoldRing)" stroke-width="2.5" transform="scale(0.92) translate(10, 10)" />

    <!-- 2. Outer Ring with Chamfered Details -->
    <circle cx="120" cy="120" r="102" fill="#141B16" stroke="url(#badgeGoldRing)" stroke-width="3" />
    <circle cx="120" cy="120" r="94" fill="none" stroke="#2EA055" stroke-width="1.2" stroke-dasharray="4 3" />

    <!-- 3. Curved Circular Typography -->
    <text class="badge-curved-text">
      <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
        ★ VERIFIED PRO CONTRACTOR ★
      </textPath>
    </text>

    <text class="badge-curved-text" style="font-size: 8px; fill: #E5B842;">
      <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
        • FENCE FRAMES NETWORK •
      </textPath>
    </text>

    <!-- 4. Inner Shield Core -->
    <circle cx="120" cy="120" r="68" fill="url(#badgeEmeraldCore)" stroke="#E5B842" stroke-width="2" />

    <!-- 5. Center Iconography: Certified Shield + Bold Checkmark -->
    <g transform="translate(120, 104)">
      <!-- Shield Silhouette -->
      <path d="M 0 -24 L 26 -12 C 26 14 16 32 0 42 C -16 32 -26 14 -26 -12 Z" 
            fill="#111A14" stroke="#4ADE80" stroke-width="2.2" stroke-linejoin="round" />

      <!-- High-Gloss Verified Checkmark -->
      <path d="M -12 4 L -3 14 L 14 -8" 
            fill="none" stroke="url(#badgeCheckGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 6. Bottom Banner Ribbon -->
    <g transform="translate(120, 156)">
      <rect x="-60" y="-10" width="120" height="20" rx="4" fill="#0B0E0C" stroke="#E5B842" stroke-width="1.5" />
      <text class="badge-sub" x="0" y="3.5">LICENSED &amp; VETTED</text>
    </g>

  </g>
</svg>
