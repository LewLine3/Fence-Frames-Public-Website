<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Rowdies Font Standard -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&amp;display=swap');
      .stamp-header {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #FFFFFF;
        letter-spacing: 0.1em;
        text-anchor: middle;
        text-transform: uppercase;
      }
      .stamp-main {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #4ADE80;
        letter-spacing: 0.08em;
        text-anchor: middle;
        text-transform: uppercase;
      }
      .stamp-sub {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 9px;
        fill: #E5B842;
        letter-spacing: 0.14em;
        text-anchor: middle;
      }
      .stamp-footer {
        font-family: 'Rowdies', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 7.5px;
        fill: #94A3B8;
        letter-spacing: 0.1em;
        text-anchor: middle;
      }
    </style>

    <linearGradient id="stampEmeraldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#2EA055" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <linearGradient id="stampGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- HOA PRE-APPROVED COMPLIANCE STAMP (ARC SEAL) -->
  <!-- Official Architectural Review Stamp for Blueprint Packets -->
  <!-- ======================================================== -->
  <g id="HOA-Compliance-Stamp" filter="url(#stampShadow)">

    <!-- 1. Architectural Chamfered Outer Shield / Seal -->
    <rect x="14" y="14" width="212" height="212" rx="20" fill="#0B0E0C" stroke="url(#stampEmeraldRing)" stroke-width="3.5" />
    <rect x="22" y="22" width="196" height="196" rx="14" fill="#141B16" stroke="#E5B842" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- 2. Top Header Ribbon -->
    <g transform="translate(120, 52)">
      <path d="M -75 -14 L 75 -14 L 65 10 L -65 10 Z" fill="#1B3826" stroke="#4ADE80" stroke-width="1.2" />
      <text class="stamp-header" x="0" y="2">ARC COMPLIANT</text>
    </g>

    <!-- 3. Center Stamp Typography -->
    <g transform="translate(120, 102)">
      <!-- Mini Fence Post Graphic -->
      <path d="M -24 0 L -24 -18 L -18 -24 L -12 -18 L -12 0 Z" fill="#DEB35E" stroke="#0B0E0C" stroke-width="1.2" />
      <path d="M 12 0 L 12 -18 L 18 -24 L 24 -18 L 24 0 Z" fill="#2EA055" stroke="#0B0E0C" stroke-width="1.2" />
      <line x1="-32" y1="-8" x2="32" y2="-8" stroke="#E5B842" stroke-width="2" />
      <line x1="-32" y1="-2" x2="32" y2="-2" stroke="#E5B842" stroke-width="2" />
    </g>

    <!-- 4. Bold Approval Wordmark -->
    <g transform="translate(120, 136)">
      <text class="stamp-main" x="0" y="0">PRE-APPROVED</text>
    </g>

    <!-- 5. Sub-Tagline -->
    <g transform="translate(120, 158)">
      <text class="stamp-sub" x="0" y="0">HOA SUBMITTAL READY</text>
    </g>

    <!-- 6. Bottom Security Code & Verification Standard -->
    <g transform="translate(120, 188)">
      <line x1="-65" y1="-12" x2="65" y2="-12" stroke="#2A3D30" stroke-width="1" />
      <text class="stamp-footer" x="0" y="0">FENCE FRAMES DESIGN STANDARD</text>
      <text class="stamp-footer" x="0" y="12" style="fill: #4ADE80; font-weight: 700;">★ 100% BYLAW COMPLIANCE ★</text>
    </g>

  </g>
</svg>
