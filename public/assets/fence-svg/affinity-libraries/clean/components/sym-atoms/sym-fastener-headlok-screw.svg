<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" width="1in" height="1in">
  <title>sym-fastener-headlok-screw</title>
  <desc>FastenMaster HeadLOK Heavy-Duty Flathead Structural Timber Screw (architectural detail representation with washer face and spider drive recess).</desc>
  <g id="sym-fastener-headlok-screw">
    <!-- Outer Washer Edge -->
    <circle cx="0.5" cy="0.5" r="0.44" fill="#1b1c20" stroke="#374151" stroke-width="0.04"/>
    <!-- Recessed Flange Face -->
    <circle cx="0.5" cy="0.5" r="0.32" fill="#111827"/>
    <!-- Star / Spider Drive Recess -->
    <path d="M 0.5 0.32 L 0.5 0.68 M 0.34 0.41 L 0.66 0.59 M 0.34 0.59 L 0.66 0.41" stroke="#4b5563" stroke-width="0.05" stroke-linecap="round"/>
    <!-- Specular Highlight Arc -->
    <path d="M 0.22 0.35 A 0.36 0.36 0 0 1 0.78 0.35" fill="none" stroke="#9ca3af" stroke-width="0.04" opacity="0.45"/>
  </g>
</svg>