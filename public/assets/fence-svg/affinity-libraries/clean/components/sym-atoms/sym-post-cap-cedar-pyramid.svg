  <!-- Outer Shell -->
  <path d="M 0 2.75 L 2.125 0.1875 L 4.25 2.75 Z" fill="#000000" />
  <rect x="0" y="2.75" width="4.25" height="0.75" fill="#000000" />
  <!-- Skirt Inset -->
  <rect x="0.1875" y="2.9375" width="3.875" height="0.375" fill="url(#cedar-cap-shine)" />
  <!-- Left Face (Sunlit) -->
  <path d="M 0.1875 2.75 L 2.125 0.375 L 2.125 2.75 Z" fill="url(#cedar-cap-shine)" />
  <!-- Right Face (Shadow) -->
  <path d="M 2.125 0.375 L 4.0625 2.75 L 2.125 2.75 Z" fill="#a8683c" opacity="0.85" />
  
</svg>