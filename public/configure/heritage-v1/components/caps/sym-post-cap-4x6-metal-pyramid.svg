<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6.5 1.5" width="936" height="216">
  <title>sym-post-cap-4x6-metal-pyramid</title>
  <defs>
    <linearGradient id="cedar-rail-shine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#dca070" stop-opacity="1"/>
      <stop offset="55%" stop-color="#c88254" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b06e42" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cedar-trim-shine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#dca070" stop-opacity="1"/>
      <stop offset="50%" stop-color="#c88254" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b06e42" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cedar-cap-shine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d49868" stop-opacity="1"/>
      <stop offset="52%" stop-color="#be784c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a8683c" stop-opacity="1"/>
