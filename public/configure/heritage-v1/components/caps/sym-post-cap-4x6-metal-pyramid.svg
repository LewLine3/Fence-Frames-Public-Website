  <!-- Outer Shell -->
  <path d="M 0 1.125 L 3.25 0.1875 L 6.5 1.125 Z" fill="#000000" />
  <rect x="0" y="1.125" width="6.5" height="0.375" fill="#000000" />
  <!-- Skirt Inset -->
  <rect x="0.1875" y="1.3125" width="6.125" height="0" fill="url(#metal-cap-shine)" />
  <!-- Left Face (Sunlit) -->
  <path d="M 0.1875 1.125 L 3.25 0.375 L 3.25 1.125 Z" fill="url(#metal-cap-shine)" />
  <!-- Right Face (Shadow) -->
