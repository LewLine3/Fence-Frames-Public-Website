<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6 3" width="864" height="432">
  <title>sym-bracket-post-flange-anchor</title>
  <desc>Heavy-duty black powder-coated steel post base anchor flange with bolt holes. 1 unit = 1 inch.</desc>
  <g id="sym-bracket-post-flange-anchor">
    <g id="shell">
      <!-- Outer shoe shell -->
      <path fill="#000000" d="M 0 1.75 L 0.75 1.75 L 0.75 0 L 5.25 0 L 5.25 1.75 L 6 1.75 L 6 3 L 0 3 Z"/>
    </g>
    <g id="fill" data-slot="bracket-material">
      <!-- Base plate and sleeve fill -->
      <path fill="#1a1a1a" d="M 0.0625 1.8125 L 0.8125 1.8125 L 0.8125 0.0625 L 5.1875 0.0625 L 5.1875 1.8125 L 5.9375 1.8125 L 5.9375 2.9375 L 0.0625 2.9375 Z"/>
      <!-- Inner post socket outline -->
      <rect x="1.0" y="0.25" width="4.0" height="1.5" fill="#0d0d0d" stroke="#333333" stroke-width="0.0625"/>
      <!-- Anchor bolt holes in flange base -->
      <circle cx="0.4" cy="2.375" r="0.2" fill="#000000"/>
      <circle cx="0.4" cy="2.375" r="0.14" fill="#444444"/>
      <circle cx="5.6" cy="2.375" r="0.2" fill="#000000"/>
      <circle cx="5.6" cy="2.375" r="0.14" fill="#444444"/>
      <!-- Post fastening screw holes -->
      <circle cx="2.0" cy="1.0" r="0.12" fill="#444444"/>
      <circle cx="4.0" cy="1.0" r="0.12" fill="#444444"/>
    </g>
  </g>
</svg>
