<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2 3.5" width="288" height="504">
  <title>sym-bracket-rail-hanger-hidden</title>
  <desc>Concealed flange rail hanger bracket for invisible post-to-rail joist connections. 1 unit = 1 inch.</desc>
  <g id="sym-bracket-rail-hanger-hidden">
    <g id="shell">
      <path fill="#000000" d="M 0 0 L 2 0 L 2 3.5 L 0 3.5 Z"/>
    </g>
    <g id="fill" data-slot="bracket-material">
      <path fill="#2c3e50" d="M 0.0625 0.0625 L 1.9375 0.0625 L 1.9375 3.4375 L 0.0625 3.4375 Z"/>
      <!-- Concealed slot and screw holes -->
      <rect x="0.85" y="0.5" width="0.3" height="2.5" rx="0.05" fill="#1a252f"/>
      <circle cx="0.4" cy="0.8" r="0.14" fill="#11161a"/>
      <circle cx="0.4" cy="2.7" r="0.14" fill="#11161a"/>
      <circle cx="1.6" cy="0.8" r="0.14" fill="#11161a"/>
      <circle cx="1.6" cy="2.7" r="0.14" fill="#11161a"/>
    </g>
  </g>
</svg>
