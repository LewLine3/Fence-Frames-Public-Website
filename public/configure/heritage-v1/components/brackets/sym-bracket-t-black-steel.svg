      <path fill="#1a1a1a" d="M 0.0625 0.5625 C 0.0625 0.2865 0.2865 0.0625 0.5625 0.0625 L 5.4375 0.0625 C 5.7135 0.0625 5.9375 0.2865 5.9375 0.5625 L 5.9375 1.9375 C 5.9375 2.2135 5.7135 2.4375 5.4375 2.4375 L 3.9375 2.4375 L 3.9375 5.4375 C 3.9375 5.7135 3.7135 5.9375 3.4375 5.9375 L 2.5625 5.9375 C 2.2865 5.9375 2.0625 5.7135 2.0625 5.4375 L 2.0625 2.4375 L 0.5625 2.4375 C 0.2865 2.4375 0.0625 2.2135 0.0625 1.9375 Z"/>
      <!-- Screw / bolt hole details -->
      <circle cx="0.8" cy="1.25" r="0.22" fill="#000000"/>
      <circle cx="0.8" cy="1.25" r="0.16" fill="#333333"/>
      <circle cx="5.2" cy="1.25" r="0.22" fill="#000000"/>
      <circle cx="5.2" cy="1.25" r="0.16" fill="#333333"/>
      <circle cx="3.0" cy="0.75" r="0.22" fill="#000000"/>
      <circle cx="3.0" cy="0.75" r="0.16" fill="#333333"/>
      <circle cx="3.0" cy="3.50" r="0.22" fill="#000000"/>
      <circle cx="3.0" cy="3.50" r="0.16" fill="#333333"/>
      <circle cx="3.0" cy="4.90" r="0.22" fill="#000000"/>
      <circle cx="3.0" cy="4.90" r="0.16" fill="#333333"/>
    </g>
