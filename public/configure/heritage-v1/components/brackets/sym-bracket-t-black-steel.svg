<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6 6" width="864" height="864">
  <title>sym-bracket-t-black-steel</title>
  <desc>Decorative black steel T-plate bracket for post-to-rail junctions. 1 unit = 1 inch.</desc>
  <g id="sym-bracket-t-black-steel">
    <g id="shell">
      <!-- Black shell outline: 6x6 T shape -->
      <path fill="#000000" d="M 0 0.5 C 0 0.224 0.224 0 0.5 0 L 5.5 0 C 5.776 0 6 0.224 6 0.5 L 6 2 C 6 2.276 5.776 2.5 5.5 2.5 L 4 2.5 L 4 5.5 C 4 5.776 3.776 6 3.5 6 L 2.5 6 C 2.224 6 2 5.776 2 5.5 L 2 2.5 L 0.5 2.5 C 0.224 2.5 0 2.276 0 2 Z"/>
    </g>
    <g id="fill" data-slot="bracket-material">
