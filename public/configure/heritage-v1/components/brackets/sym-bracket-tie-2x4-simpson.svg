<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 4" width="432" height="576">
  <title>sym-bracket-tie-2x4-simpson</title>
  <desc>Galvanized Simpson-style RTC24 rigid tie corner bracket for 2x4 rail connections. 1 unit = 1 inch.</desc>
  <g id="sym-bracket-tie-2x4-simpson">
    <g id="shell">
      <path fill="#000000" d="M 0 0 L 0.75 0 L 0.75 0.5 L 2.75 0.5 L 2.75 0 L 3.5 0 L 3.5 4 L 2.75 4 L 2.75 3.5 L 0.75 3.5 L 0.75 4 L 0 4 Z"/>
    </g>
    <g id="fill" data-slot="bracket-material">
      <path fill="#99a3a4" d="M 0.0625 0.0625 L 0.6875 0.0625 L 0.6875 0.5625 L 2.6875 0.5625 L 2.6875 0.0625 L 3.4375 0.0625 L 3.4375 3.9375 L 2.6875 3.9375 L 2.6875 3.4375 L 0.6875 3.4375 L 0.6875 3.9375 L 0.0625 3.9375 Z"/>
      <!-- Metallic shine texture overlay -->
      <path fill="#bdc3c7" fill-opacity="0.6" d="M 0.1 0.1 L 0.65 0.1 L 0.65 3.9 L 0.1 3.9 Z"/>
      <!-- Stamping / rivet punch details -->
      <circle cx="0.375" cy="0.8" r="0.12" fill="#424949"/>
      <circle cx="0.375" cy="2.0" r="0.12" fill="#424949"/>
      <circle cx="0.375" cy="3.2" r="0.12" fill="#424949"/>
      <circle cx="3.125" cy="0.8" r="0.12" fill="#424949"/>
      <circle cx="3.125" cy="2.0" r="0.12" fill="#424949"/>
      <circle cx="3.125" cy="3.2" r="0.12" fill="#424949"/>
      <rect x="1.0" y="1.8" width="1.5" height="0.4" rx="0.1" fill="#707b7c"/>
    </g>
  </g>
</svg>
