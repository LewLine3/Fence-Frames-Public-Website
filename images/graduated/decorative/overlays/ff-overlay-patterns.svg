<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fence Frames  SVG overlay pattern defs (2026-08-08)
  Include inline or via <use>. Control with CSS:
    --pattern-color, --pattern-opacity on a parent element.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <pattern id="overlay-wood-horizontal" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect x="1" y="2" width="10" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="4" y="6" width="8" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="2" y="10" width="12" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="0" y="14" width="7" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
    </pattern>

    <pattern id="overlay-wood-vertical" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect x="2" y="1" width="1" height="10" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="6" y="4" width="1" height="8" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="10" y="2" width="1" height="12" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="14" y="0" width="1" height="7" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
    </pattern>

    <pattern id="overlay-wood-diagonal" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
      <rect x="1" y="2" width="10" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="4" y="6" width="8" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="2" y="10" width="12" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
      <rect x="0" y="14" width="7" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.4)" />
    </pattern>

    <pattern id="overlay-wood-dense" patternUnits="userSpaceOnUse" width="24" height="16">
      <rect x="0" y="2" width="14" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.35)" />
      <rect x="10" y="6" width="12" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.35)" />
      <rect x="2" y="10" width="18" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.35)" />
      <rect x="8" y="14" width="10" height="1" fill="var(--pattern-color, currentColor)" opacity="var(--pattern-opacity, 0.35)" />
    </pattern>

    <pattern id="overlay-diagonal-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--pattern-color, currentColor)" stroke-width="1" stroke-opacity="var(--pattern-opacity, 0.5)" />
    </pattern>

    <pattern id="overlay-crosshatch" patternUnits="userSpaceOnUse" width="12" height="12">
      <path d="M 0 0 L 12 12 M 12 0 L 0 12" stroke="var(--pattern-color, currentColor)" stroke-width="1" stroke-opacity="var(--pattern-opacity, 0.4)" />
    </pattern>

    <pattern id="overlay-grid" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--pattern-color, currentColor)" stroke-width="1" stroke-opacity="var(--pattern-opacity, 0.3)" />
    </pattern>

    <pattern id="overlay-brick" patternUnits="userSpaceOnUse" width="32" height="16">
      <path d="M 0 0 L 32 0 M 0 8 L 32 8 M 0 16 L 32 16 M 16 0 L 16 8 M 0 8 L 0 16 M 32 8 L 32 16"
            stroke="var(--pattern-color, currentColor)" stroke-width="1" stroke-opacity="var(--pattern-opacity, 0.45)" fill="none" />
    </pattern>

    <pattern id="overlay-line-variable" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="var(--pattern-color, currentColor)" stroke-width="1" stroke-opacity="0.2" />
      <line x1="12" y1="0" x2="12" y2="40" stroke="var(--pattern-color, currentColor)" stroke-width="3" stroke-opacity="0.5" />
      <line x1="28" y1="0" x2="28" y2="40" stroke="var(--pattern-color, currentColor)" stroke-width="1" stroke-opacity="0.3" />
    </pattern>
  </defs>
</svg>
